/* ── 力度尺交互：上下拖动调力度，松手击球 ── */
let powerDragging = false;

function powerFromY(clientX, clientY){
  const t0 = toStage(clientX, clientY);
  const r  = rectInStage(pw);
  const padTop = 10, padBot = 10;
  const t = (t0.y - r.top - padTop) / Math.max(1, r.height - padTop - padBot);
  return Math.max(0, Math.min(1, t));    // 往下拉杆 → 力越大
}

function onPowerDown(e){
  if(shooting || gameOver || placing || ballInHand) return;
  if(e.cancelable) e.preventDefault();
  powerDragging = true;
  const t = e.touches ? e.touches[0] : e;
  power = powerFromY(t.clientX, t.clientY);
  drawPowerBar();
}

function onPowerMove(e){
  if(!powerDragging) return;
  if(e.cancelable) e.preventDefault();
  const t = e.touches ? e.touches[0] : e;
  power = powerFromY(t.clientX, t.clientY);
  drawPowerBar();
}

function onPowerUp(e){
  if(!powerDragging) return;
  powerDragging = false;
  if(power > 0.05){
    doShoot();                 // 松手即出杆
  } else {
    power = 0;
    drawPowerBar();
  }
}

const pwWrap = document.getElementById('powerWrap');
pwWrap.addEventListener('pointerdown', onPowerDown);
pwWrap.addEventListener('pointermove', onPowerMove);
pwWrap.addEventListener('pointerup',   onPowerUp);
pwWrap.addEventListener('pointercancel', onPowerUp);
pwWrap.addEventListener('pointerleave',  onPowerUp);
pwWrap.addEventListener('touchstart', e => { e.preventDefault(); onPowerDown(e); }, { passive:false });
pwWrap.addEventListener('touchmove',  e => { e.preventDefault(); onPowerMove(e); }, { passive:false });
pwWrap.addEventListener('touchend',   e => { e.preventDefault(); onPowerUp(e); },   { passive:false });
pwWrap.addEventListener('contextmenu', e => e.preventDefault());

/* ── 加塞球交互：拖红点设置击球点 ── */
let spinDragging = false;
const spinWrapEl = document.getElementById('spinWrap');

function spinFromEvent(e){
  const t = e.touches ? e.touches[0] : e;
  const p = toStage(t.clientX, t.clientY);
  const r = rectInStage(sb);
  const cx = r.left + r.width/2, cy = r.top + r.height/2;
  const R = Math.min(r.width, r.height)/2 - 1;
  let ux =  (p.x - cx) / (R * 0.72);
  let uy = -(p.y - cy) / (R * 0.72);
  const m = Math.hypot(ux, uy);
  if(m > 1){ ux /= m; uy /= m; }
  // 拖回中心附近 = 无塞
  spinX = Math.abs(ux) < 0.10 ? 0 : ux;
  spinY = Math.abs(uy) < 0.10 ? 0 : uy;
  drawSpinBall();
}

function onSpinDown(e){
  if(shooting || gameOver) return;
  if(e.cancelable) e.preventDefault();
  spinDragging = true;
  spinWrapEl.classList.add('active');
  spinFromEvent(e);
}
function onSpinMove(e){
  if(!spinDragging) return;
  if(e.cancelable) e.preventDefault();
  spinFromEvent(e);
}
function onSpinUp(){
  if(!spinDragging) return;
  spinDragging = false;
  spinWrapEl.classList.remove('active');
}

spinWrapEl.addEventListener('pointerdown', onSpinDown);
spinWrapEl.addEventListener('pointermove', onSpinMove);
spinWrapEl.addEventListener('pointerup',   onSpinUp);
spinWrapEl.addEventListener('pointercancel', onSpinUp);
spinWrapEl.addEventListener('pointerleave',  onSpinUp);
spinWrapEl.addEventListener('touchstart', e => { e.preventDefault(); onSpinDown(e); }, { passive:false });
spinWrapEl.addEventListener('touchmove',  e => { e.preventDefault(); onSpinMove(e); }, { passive:false });
spinWrapEl.addEventListener('touchend',   e => { e.preventDefault(); onSpinUp(e); },   { passive:false });
spinWrapEl.addEventListener('contextmenu', e => e.preventDefault());

/* ── 角度微调：增量式，拖多少转多少，没有硬上限（能一直转到 360°）── */
let fineDragging = false, fineLastY = 0;
const fineWrapEl = document.getElementById('fineWrap');
const fineValEl  = document.getElementById('fineVal');

function normAngle(a){
  while(a >  Math.PI) a -= Math.PI*2;
  while(a < -Math.PI) a += Math.PI*2;
  return a;
}
function fineFromEvent(e, first){
  const t0 = e.touches ? e.touches[0] : e;
  const p  = toStage(t0.clientX, t0.clientY);
  if(first){ fineLastY = p.y; return; }
  const dy = p.y - fineLastY;
  fineLastY = p.y;
  aimOffset = normAngle(aimOffset + dy * FINE_SENS);
  applyAim();
}

function onFineDown(e){
  if(shooting || gameOver) return;
  if(e.cancelable) e.preventDefault();
  fineDragging = true;
  fineWrapEl.classList.add('active');
  fineFromEvent(e, true);
}
function onFineMove(e){
  if(!fineDragging) return;
  if(e.cancelable) e.preventDefault();
  fineFromEvent(e, false);
}
function onFineUp(){
  if(!fineDragging) return;
  fineDragging = false;
  fineWrapEl.classList.remove('active');
}

fineWrapEl.addEventListener('pointerdown', onFineDown);
fineWrapEl.addEventListener('pointermove', onFineMove);
fineWrapEl.addEventListener('pointerup',   onFineUp);
fineWrapEl.addEventListener('pointercancel', onFineUp);
fineWrapEl.addEventListener('pointerleave',  onFineUp);
fineWrapEl.addEventListener('touchstart', e => { e.preventDefault(); onFineDown(e); }, { passive:false });
fineWrapEl.addEventListener('touchmove',  e => { e.preventDefault(); onFineMove(e); }, { passive:false });
fineWrapEl.addEventListener('touchend',   e => { e.preventDefault(); onFineUp(e); },   { passive:false });
fineWrapEl.addEventListener('contextmenu', e => e.preventDefault());

document.getElementById('btnRules').onclick   = showRules;
document.getElementById('btnRestart').onclick = newGame;

window.addEventListener('resize', () => { layout(); });
window.addEventListener('orientationchange', () => setTimeout(layout, 220));

/* 调试出口 —— 测试脚本要能读内部状态 */
window.__G = {
  get balls(){ return balls; },
  get shooting(){ return shooting; },
  get shots(){ return shots; },
  get gameOver(){ return gameOver; },
  get ballInHand(){ return ballInHand; },
  get power(){ return power; },
  get aiming(){ return aiming; },
  get placing(){ return placing; },
  get portait(){ return PORTRAIT; },
  get scale(){ return SCALE; },
  get elapsed(){ return elapsed; },
  get cueBall(){ return cueBall(); },
  get left(){ return remainingBalls().length; },
  get cx(){ return CX; },
  get cy(){ return CY; },
  get spinX(){ return spinX; },
  get spinY(){ return spinY; },
  get aimOffset(){ return aimOffset; },
  get aimDeg(){ return +(aimOffset * 180 / Math.PI).toFixed(1); },
  get aimDir(){ return { x: aimDir.x, z: aimDir.z }; },
  get aimDegAbs(){ return +(Math.atan2(aimDir.z, aimDir.x) * 180 / Math.PI).toFixed(1); },
  setFine(deg){ aimOffset = normAngle(deg * Math.PI/180); applyAim(); },
  get firstHit(){ return shotLog ? shotLog.firstHit : null; },
  get lastPotted(){ return shotLog ? shotLog.potted.slice() : null; },
  get lastCuePotted(){ return shotLog ? shotLog.cuePotted : null; },
  get cbV(){ const c = cueBall(); return c ? { vx:+c.vx.toFixed(3), vz:+c.vz.toFixed(3), x:+c.x.toFixed(3), z:+c.z.toFixed(3) } : null; },
  setSpin(x, y){ spinX = x; spinY = y; drawSpinBall(); },
  setPower(v){ power = Math.max(0, Math.min(1, v)); drawPowerBar(); },
  get fxCount(){ return fx.length; },
  get sinkCount(){ return sinkFx.length; },
  fxAdd(x, z, p){ addImpact(x, z, p); },
  get rolls(){ return balls.filter(b=>b.alive).map(b => [b.n, +(b.roll||0).toFixed(2)]).slice(0,4); },
  remainingOf, groupOf, pickShot, predictShot, screenToWorld, worldToScreen,
  nextTargetBall, newGame,
  _kill(n){ const b = ballByN(n); if(b) b.alive = false; updateHUD(); },
  _place(n, x, z){ const b = ballByN(n); if(b){ b.alive = true; b.x = x; b.z = z; b.vx = 0; b.vz = 0; } },
  _resolve(log){ resolveShot(log); },
  _shoot(vx, vz){
    const cb = cueBall(); if(!cb) return;
    cb.vx = vx; cb.vz = vz; shooting = true; shots++;
    applyCueSpin(cb, Math.hypot(vx, vz));
    shotLog = { firstHit:null, potted:[], cuePotted:false, spinY: spinY, sideX: spinX };
    shotStartT = performance.now();
  },
  _setAim(dx, dz, p){
    const l = Math.hypot(dx, dz) || 1;
    aimBase = { x: dx/l, z: dz/l };
    aimOffset = 0;
    applyAim();
    power = p == null ? 0.8 : p;
    drawPowerBar();
    drawFineBar();
  },
};

/* 启动 */
layout();
newGame();
document.getElementById('boot').classList.add('gone');
requestAnimationFrame(loop);

})();
