<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1a1230">
<title>中八 2D</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;user-select:none}
  html,body{width:100%;height:100%;overflow:hidden;overscroll-behavior:none;
    background:#140f26;color:#e8eaf0;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",system-ui,sans-serif}
  #stage{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;
         background:#140f26}
  canvas{display:block;touch-action:none}

  /* ── 顶部 HUD ── */
  #hud{position:absolute;top:0;left:0;right:0;z-index:10;pointer-events:none;
       display:flex;align-items:flex-start;gap:8px;padding:8px 10px}
  .pnl{flex:1;min-width:0;display:flex;align-items:baseline;gap:6px;
       background:linear-gradient(180deg,rgba(46,56,120,.92),rgba(30,36,84,.92));
       border:2px solid rgba(120,140,220,.35);border-radius:14px;padding:5px 11px}
  .pnl.right{justify-content:flex-end}
  .pnl .lbl{font-size:10.5px;font-weight:700;color:#96a2ce;white-space:nowrap;letter-spacing:.5px}
  .pnl .big{font-size:20px;font-weight:900;color:#eaf0ff;line-height:1;
            font-variant-numeric:tabular-nums}
  #leftN{color:#7ee8a2}
  #shotN{color:#ffcc4d}

  /* 进球进度条 */
  #progWrap{position:absolute;top:56px;left:12px;right:12px;height:4px;z-index:10;
    background:rgba(255,255,255,.09);border-radius:2px;overflow:hidden;pointer-events:none}
  #progFill{display:block;height:100%;width:0%;border-radius:2px;
    background:linear-gradient(90deg,#7ee8a2,#ffcc4d);
    transition:width .35s cubic-bezier(.2,.9,.25,1)}

  #center{display:flex;flex-direction:column;align-items:center;gap:3px;flex:0 0 auto}
  #timer{font-size:22px;font-weight:900;color:#fff;line-height:1;
         text-shadow:0 2px 8px rgba(0,0,0,.8);font-variant-numeric:tabular-nums}
  #timer.low{color:#ff6b6b}
  #turnTag{font-size:10.5px;font-weight:800;letter-spacing:1px;color:#7ee8a2;
           background:rgba(10,20,14,.75);border:1px solid rgba(126,232,162,.4);
           border-radius:9px;padding:1px 8px;white-space:nowrap}
  #turnTag.ai{color:#ffcc4d;border-color:rgba(255,204,77,.45);background:rgba(28,20,6,.75)}

  /* ── 左侧：力度（球杆在杆架里上下滑） ── */
  #powerWrap{position:absolute;left:6px;top:0;
             z-index:10;pointer-events:auto;touch-action:none;cursor:pointer;
             padding:5px 6px;border-radius:16px;
             background:rgba(18,14,38,.45);
             border:1px solid rgba(255,255,255,.13);
             box-shadow:0 4px 16px rgba(0,0,0,.38)}
  #powerBar{width:30px;display:block;pointer-events:none}

  /* ── 右侧一列：加塞球 + 角度微调刻度 ── */
  #rightCol{position:absolute;right:6px;top:0;
            z-index:10;display:flex;flex-direction:column;align-items:center;
            gap:2px;touch-action:none}
  .rclbl{font-size:9px;color:#8e9ac0;letter-spacing:.5px;line-height:1.2}
  #spinWrap{pointer-events:auto;touch-action:none;cursor:pointer;
            padding:4px;border-radius:50%;
            background:rgba(18,14,38,.45);
            border:1px solid rgba(255,255,255,.13);
            box-shadow:0 4px 16px rgba(0,0,0,.38)}
  #spinBall{width:50px;height:50px;display:block;pointer-events:none}
  #spinWrap.active{border-color:rgba(255,204,77,.75);
                   box-shadow:0 0 18px rgba(255,204,77,.45)}
  #fineWrap{pointer-events:auto;touch-action:none;cursor:pointer;margin-top:2px;
            padding:5px 6px;border-radius:16px;
            background:rgba(18,14,38,.45);
            border:1px solid rgba(255,255,255,.13);
            box-shadow:0 4px 16px rgba(0,0,0,.38)}
  #fineBar{width:26px;display:block;pointer-events:none}
  #fineWrap.active{border-color:rgba(255,204,77,.75);
                   box-shadow:0 0 18px rgba(255,204,77,.45)}

  /* ── 底部按钮 ── */
  #bar{position:absolute;left:50%;transform:translateX(-50%);bottom:5px;
       display:flex;gap:7px;z-index:10}
  #bar button{border:1px solid rgba(255,255,255,.16);border-radius:13px;
    padding:5px 13px;font-size:11px;font-weight:800;font-family:inherit;
    color:#c8d3f0;background:rgba(30,36,84,.82);backdrop-filter:blur(8px);
    cursor:pointer;transition:transform .12s}
  #bar button:active{transform:scale(.94)}
  #bar button:focus-visible{outline:2px solid #7ee8a2;outline-offset:3px}

  /* ── 提示 ── */
  #msg{position:absolute;left:50%;transform:translateX(-50%);bottom:52px;
    padding:7px 16px;border-radius:16px;font-size:12px;white-space:nowrap;z-index:10;
    background:rgba(8,12,24,.9);border:1px solid rgba(126,232,162,.3);color:#9fb0c8;
    backdrop-filter:blur(8px);pointer-events:none;opacity:0;transition:opacity .25s;
    max-width:92vw;overflow:hidden;text-overflow:ellipsis}
  #msg.show{opacity:1}

  /* ── 弹层 ── */
  #modal{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(6,4,18,.86);backdrop-filter:blur(6px);z-index:100;padding:16px}
  #modal.show{display:flex}
  #card{width:100%;max-width:340px;background:linear-gradient(180deg,#2a2358,#1a1638);
    border:2px solid rgba(120,140,220,.4);border-radius:20px;padding:20px 18px 16px;
    text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.7)}
  #card .ic{font-size:42px;line-height:1;margin-bottom:6px}
  #card h2{font-size:21px;font-weight:900;margin-bottom:6px;color:#7ee8a2}
  #card h2.lose{color:#ff7a7a}
  #card .sub{font-size:12.5px;color:#8a94b8;line-height:1.75;
             max-height:58vh;overflow-y:auto;text-align:left;padding:0 4px}
  #card .sub b{color:#ffcc4d}
  #card button{width:100%;margin-top:12px;padding:12px;border:none;border-radius:14px;
    font-size:14px;font-weight:900;font-family:inherit;cursor:pointer;
    background:linear-gradient(180deg,#8cf0b0,#2fa860);color:#04200f}
  #card button.ghost{background:transparent;border:1px solid rgba(120,140,220,.4);
    color:#8a94b8;font-size:12.5px;padding:9px;margin-top:8px}
  #card button:active{transform:scale(.97)}

  #boot{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:12px;background:#140f26;z-index:200;transition:opacity .35s}
  #boot.gone{opacity:0;pointer-events:none}
  #boot .sp{width:30px;height:30px;border:3px solid rgba(126,232,162,.2);
    border-top-color:#7ee8a2;border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #boot .tx{font-size:12px;color:#5a6a86;letter-spacing:2px}
</style>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas>

<div id="powerWrap"><canvas id="powerBar"></canvas></div>

<div id="rightCol">
  <span class="rclbl">加塞</span>
  <div id="spinWrap"><canvas id="spinBall"></canvas></div>
  <span class="rclbl">微调</span>
  <div id="fineWrap"><canvas id="fineBar"></canvas></div>
  <span class="rclbl" id="fineVal">0°</span>
</div>

<div id="msg">① 绕白球滑动转杆 / 点一下直接指过去　② 下拉左边力度杆　③ 松手出杆</div>

<div id="bar">
  <button id="btnRules">规则</button>
  <button id="btnRestart">重开</button>
</div>

<div id="modal"><div id="card"></div></div>
<div id="boot"><div class="sp"></div><div class="tx">摆球中…</div></div>
</div><!-- /stage -->

<script>
/* 错误上报：脚本里任何运行时错误都会让 rAF 循环静默死掉，画面全黑 */
window.addEventListener('error', function(e){
  window.__FATAL = e.message + ' @' + e.lineno + ':' + e.colno;
  var d = document.createElement('div');
  d.style.cssText = 'position:absolute;left:8px;top:70px;right:8px;z-index:9999;background:#2a0000;color:#ff8a8a;font:12px monospace;padding:10px;border-radius:8px;white-space:pre-wrap';
  d.textContent = '❌ ' + e.message + '\n@' + e.lineno + ':' + e.colno + '\n' + ((e.error && e.error.stack) || '');
  document.body.appendChild(d);
}, true);
window.addEventListener('unhandledrejection', function(e){
  window.__FATAL = 'unhandled: ' + e.reason;
}, true);

(function(){
'use strict';

/* ══════════════════════════════════════════════════════════
   1 单位 = 1 米。台面内沿 2.24 × 1.12（标准 8 尺），球径 57.15mm。
   物理在桌面平面上做 2D 碰撞，渲染用 Canvas 2D 俯视。
   ══════════════════════════════════════════════════════════ */

/* ── 台面尺寸 ── */
const TABLE_W = 2.54, TABLE_H = 1.27;    // 中式八球标准内沿 2540×1270mm
const HW = TABLE_W/2, HH = TABLE_H/2;
const BALL_R = 0.0286;           // 球直径 57.2mm（中台协标准，别再放大了 —— 会让整张台面显得拥挤）
/* 袋口：中台协标准 角袋口 105mm、中袋口 120mm（腰袋比角袋宽 15mm）
   相对于 57.2mm 的球 = 1.835 倍 / 2.10 倍，与世界台联「袋口=球径 1.6 倍」同一取向 */
const PCK_CORNER = 0.0525;       // 角袋口半径（105mm 开口的一半）
const PCK_SIDE   = 0.0600;       // 中袋口半径（120mm 开口的一半）
const RAIL_W = 0.13;             // 库边宽
const CUSHION = 0.87;            // 旧常量（已被 E_CUSH 取代，保留兼容）
const BALL_DAMP = 0.96;          // 旧常量（已被 E_BALL 取代）
const FRICTION = 0.95;           // 旧常量（已被 MU_ROLL 取代）
const STOP_EPS = 0.09;          // 慢到这个速度就判停，省得滚动阶段拖太久
const SHOT_TIMEOUT = 11000;
const MAX_SPEED = 6.2;

/* ══════════════════════════════════════════════════════════
   真实台球物理常数
   —— 按 pooltool (Apache-2.0) / Han 2005 / Mathavan 2010 的模型
   核心是「滑动→滚动」两阶段 + 球间切向摩擦(throw) + 库边切向摩擦
   ══════════════════════════════════════════════════════════ */
const G_ACC      = 9.81;
const MU_SLIDE   = 0.20;    // 球-台呢 滑动摩擦系数（决定击球后那段急减速）
const MU_ROLL    = 0.09;    // 球-台呢 滚动阻力（真实约 0.01，游戏放大以保证手感）
const MU_BALL    = 0.06;    // 球-球 接触摩擦 → 产生 throw 偏转，这是「碰撞曲线」的关键
const E_BALL     = 0.95;    // 球-球 恢复系数
const MU_CUSH    = 0.20;    // 球-库 切向摩擦
const E_CUSH     = 0.86;    // 球-库 法向恢复系数
const SLIDE_EPS  = 0.012;   // 接触点速度低于这个就算纯滚动

/* 六个袋口：四角 + 两个中袋 */
const POCKETS = [
  [-HW, -HH, PCK_CORNER], [0, -HH, PCK_SIDE], [HW, -HH, PCK_CORNER],
  [-HW,  HH, PCK_CORNER], [0,  HH, PCK_SIDE], [HW,  HH, PCK_CORNER],
];

/* 球色 */
const COLORS = {
  0:'#f6f3e8',
  1:'#f2c527', 2:'#1f5fd0', 3:'#d0342c', 4:'#7b3fa0',
  5:'#e8712a', 6:'#1e8a4c', 7:'#8a2a24', 8:'#17171a',
  9:'#f2c527',10:'#1f5fd0',11:'#d0342c',12:'#7b3fa0',
  13:'#e8712a',14:'#1e8a4c',15:'#8a2a24'
};

/* ── 画布 ── */
const stageEl = document.getElementById('stage');
const cv  = document.getElementById('cv');
const ctx = cv.getContext('2d');
const pw  = document.getElementById('powerBar');
const pwx = pw.getContext('2d');
const sb  = document.getElementById('spinBall');
const sbx = sb.getContext('2d');
const fb  = document.getElementById('fineBar');
const fbx = fb.getContext('2d');

let DPR = 1, VW = 0, VH = 0;
let LW = 0, LH = 0;     // stage 逻辑视口（永远宽>高）
let SCALE = 1;          // 米 → CSS 像素
let CX = 0, CY = 0;     // 台面中心在屏幕上的位置
let PORTRAIT = false;   // 竖屏时把台子转 90°，长边竖着放

/* ══════════ 状态 ══════════ */
let balls = [];                       // {x,z,vx,vz,n,alive}
/* ══════════ 状态（纯练习：一个人把 8 颗球全部打完） ══════════ */
let ballInHand = false;
let gameOver = false;
let shotLog = null;
let shooting = false;
let shots = 0;
let aiming = false;
let aimDir = { x: 0, z: 0 };
let power = 0;
let placing = false;
let shotStartT = 0;
let elapsed = 0;                          // 累计用时（秒）
let spinX = 0, spinY = 0;                 // 加塞：x 左右(-1..1)，y 上下(-1..1，正=高杆)
let aimBase = { x: 1, z: 0 };             // 滑屏幕给的大方向
let aimOffset = 0;                        // 右侧微调刻度叠加的角度（弧度）
const FINE_SENS = 0.0016;                 // 每像素 0.092°：拖 100px 才 9°，真的是「微」
const FINE_SHOW = 0.262;                  // 刻度条只显示 ±15°，纯显示范围，不是硬上限
                                          // aimOffset 本身无上限，一直拖能转满 360°
const TOTAL_BALLS = 8;
const GROUP_CN = { solid:'全色', stripe:'花色' };

function groupOf(n){
  if(n === 8) return 'eight';
  if(n === 0) return 'cue';
  return n <= 7 ? 'solid' : 'stripe';
}
function remainingBalls(){
  return balls.filter(b => b.alive && b.n !== 0);
}
/** 练习模式下一个建议打的球：剩下的号里最小的那个 */
function nextTargetBall(){
  const left = remainingBalls();
  if(!left.length) return null;
  return left.reduce((a, b) => (b.n < a.n ? b : a));
}

/* ══════════════════════════════════════════════════════════
   坐标变换：台面米 → 屏幕 CSS 像素（固定横版，不旋转）
   ══════════════════════════════════════════════════════════ */
function worldToScreen(tx, tz){
  return { x: CX + tx*SCALE, y: CY + tz*SCALE };
}
function screenToWorld(sx, sy){
  return { x: (sx - CX)/SCALE, z: (sy - CY)/SCALE };
}
function setWorldTransform(){
  ctx.setTransform(SCALE*DPR, 0, 0, SCALE*DPR, CX*DPR, CY*DPR);
}
function setScreenTransform(){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

/* ══════════════════════════════════════════════════════════
   布局：横屏。左边留力度杆、右边留加塞球
   ══════════════════════════════════════════════════════════ */
let portraitDismissed = false;

function layout(){
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  VW = window.innerWidth;
  VH = window.innerHeight;

  /* ── 强制横屏：竖屏视口把整个 stage 转 90° 铺满，进去就是满屏横版台球桌 ──
     逻辑视口 LW×LH 永远是「宽>高」的那个方向 */
  PORTRAIT = VH > VW;
  LW = PORTRAIT ? VH : VW;
  LH = PORTRAIT ? VW : VH;

  stageEl.style.width  = LW + 'px';
  stageEl.style.height = LH + 'px';
  stageEl.style.transform = PORTRAIT
    ? `translateX(${VW}px) rotate(90deg)`
    : 'none';

  cv.width  = Math.round(LW * DPR);
  cv.height = Math.round(LH * DPR);
  cv.style.width  = LW + 'px';
  cv.style.height = LH + 'px';

  const PAD_L = 47;    // 左侧力度杆
  const PAD_R = 64;    // 右侧加塞球 + 微调
  const PAD_T = 4;     // 顶部不留东西了
  const PAD_B = 24;    // 底部两个小按钮

  const availW = Math.max(120, LW - PAD_L - PAD_R);
  const availH = Math.max(100, LH - PAD_T - PAD_B);

  const outerW = TABLE_W + RAIL_W*2;
  const outerH = TABLE_H + RAIL_W*2;

  SCALE = Math.min(availW / outerW, availH / outerH);
  if(!isFinite(SCALE) || SCALE <= 0) SCALE = 1;

  CX = PAD_L + availW/2;
  CY = PAD_T + availH/2;

  // 左侧力度杆（用 JS 定 top，避免 transform 让命中测试变麻烦）
  const pbH = Math.min(230, Math.max(110, availH - 10));
  pw.style.width  = '30px';
  pw.style.height = pbH + 'px';
  pw.width  = Math.round(30 * DPR);
  pw.height = Math.round(pbH * DPR);
  document.getElementById('powerWrap').style.top =
    Math.round(PAD_T + (availH - (pbH + 12))/2) + 'px';

  // 右侧加塞球
  const sbSize = Math.min(54, Math.max(34, availH * 0.15));
  sb.style.width  = sbSize + 'px';
  sb.style.height = sbSize + 'px';
  sb.width  = Math.round(sbSize * DPR);
  sb.height = Math.round(sbSize * DPR);

  // 右侧微调刻度 —— 拉长，太短手指按不准
  const fbH = Math.min(200, Math.max(100, availH * 0.46));
  fb.style.height = fbH + 'px';
  fb.width  = Math.round(30 * DPR);
  fb.height = Math.round(fbH * DPR);

  // 右列整体垂直居中
  const colH = 12 + 6 + sbSize + 6 + 12 + 6 + fbH;
  document.getElementById('rightCol').style.top =
    Math.round(PAD_T + Math.max(0, (availH - colH)/2)) + 'px';

  draw();
  drawPowerBar();
  drawSpinBall();
  drawFineBar();
}

/* 屏幕坐标 → stage 逻辑坐标（竖屏时 stage 转了 90°） */
function toStage(clientX, clientY){
  if(!PORTRAIT) return { x: clientX, y: clientY };
  return { x: clientY, y: VW - clientX };
}

/* 元素在 stage 坐标系里的盒子（不含任何 transform，offset 链累加） */
function rectInStage(el){
  let x = 0, y = 0, n = el;
  while(n && n !== stageEl){
    x += n.offsetLeft; y += n.offsetTop;
    n = n.offsetParent;
  }
  return { left:x, top:y, width: el.offsetWidth, height: el.offsetHeight };
}

/* ══════════════════════════════════════════════════════════
   摆球
   ══════════════════════════════════════════════════════════ */
function newRack(){
  balls = [];
  // 白球
  balls.push({ x:-HW*0.60, z:0, vx:0, vz:0, n:0, alive:true });

  /* 8 颗球用菱形摆（1-2-3-2），8 号压在第 3 排正中 —— 台球里经典的钻石形，
     比塞满 15 颗更适合现在放大的球径 */
  const gap = BALL_R*2 + 0.0020;
  const apexX = HW*0.52;
  const rows = [1, 2, 3, 2];
  // 1,2,3 排给 1~6 号，第 3 排正中给 8 号，最后一排 2 颗给 7 号和 9 号
  const order = [1, 2, 3, 8, 4, 5, 6, 7];
  let k = 0;
  for(let row = 0; row < rows.length; row++){
    const cnt = rows[row];
    for(let i = 0; i < cnt; i++){
      const x = apexX + row * gap * 0.866;
      const z = (i - (cnt - 1)/2) * gap;
      balls.push({ x, z, vx:0, vz:0, n: order[k++], alive:true });
    }
  }
}
function ballByN(n){ return balls.find(b => b.n === n); }
function cueBall(){ return balls.find(b => b.n === 0); }

/* ══════════════════════════════════════════════════════════
   撞击特效：火花 / 冲击波 / 落袋缩球
   ══════════════════════════════════════════════════════════ */
/* ── 撞击音：WebAudio 现场合成，不加载任何音频文件 ── */
let actx = null, lastBlipT = 0;
function ensureAudio(){
  if(actx) return actx;
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    actx = new AC();
  }catch(e){ actx = null; }
  return actx;
}
function blip(freq, vol, dur){
  // 一帧里可能撞好几次，限流到 25ms 一次，否则变成噪音
  const now = performance.now();
  if(now - lastBlipT < 25) return;
  lastBlipT = now;
  const a = ensureAudio();
  if(!a) return;
  try{
    if(a.state === 'suspended') a.resume();
    const o = a.createOscillator();
    const g = a.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(freq, a.currentTime);
    o.frequency.exponentialRampToValueAtTime(freq*0.42, a.currentTime + dur);
    g.gain.setValueAtTime(0.0001, a.currentTime);
    g.gain.exponentialRampToValueAtTime(Math.max(0.002, vol), a.currentTime + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
    o.connect(g); g.connect(a.destination);
    o.start(); o.stop(a.currentTime + dur + 0.02);
  }catch(e){}
}

const fx = [];
const sinkFx = [];

function addImpact(x, z, power){
  if(fx.length > 36) fx.shift();
  const p = Math.max(0.22, Math.min(1, power));
  fx.push({ x, z, p, t: 0, life: 0.30, seed: Math.random()*6.28318 });
  blip(340 + p*560, 0.03 + p*0.15, 0.05 + p*0.03);
}
function addSink(x, z, n){
  if(sinkFx.length > 20) sinkFx.shift();
  sinkFx.push({ x, z, n, t: 0, life: 0.40 });
  blip(160, 0.13, 0.17);
}
function stepFx(dt){
  for(let i = fx.length - 1; i >= 0; i--){
    fx[i].t += dt;
    if(fx[i].t >= fx[i].life) fx.splice(i, 1);
  }
  for(let i = sinkFx.length - 1; i >= 0; i--){
    sinkFx[i].t += dt;
    if(sinkFx[i].t >= sinkFx[i].life) sinkFx.splice(i, 1);
  }
}
function drawFx(c){
  // 落袋：球迅速缩小 + 变暗，像掉进洞里
  for(const s of sinkFx){
    const k  = s.t / s.life;
    const rr = BALL_R * (1 - k) * (1 - k);
    if(rr < BALL_R*0.05) continue;
    const col = COLORS[s.n] || '#888';
    const g = c.createRadialGradient(s.x - rr*0.30, s.z - rr*0.36, 0, s.x, s.z, rr*1.05);
    g.addColorStop(0,    shade(col, 1.5));
    g.addColorStop(0.55, col);
    g.addColorStop(1,    shade(col, 0.40));
    c.save();
    c.globalAlpha = (1 - k) * 0.95;
    c.fillStyle = g;
    c.beginPath(); c.arc(s.x, s.z, rr, 0, Math.PI*2); c.fill();
    c.restore();
  }
  // 撞击：白闪 + 扩散冲击波 + 迸射火花
  for(const f of fx){
    const k = f.t / f.life;
    const a = (1 - k) * (1 - k) * f.p;
    if(a <= 0.01) continue;
    c.save();
    // 中心白闪
    if(k < 0.45){
      const g = c.createRadialGradient(f.x, f.z, 0, f.x, f.z, BALL_R*1.7);
      g.addColorStop(0,    `rgba(255,255,245,${Math.min(1, a*2.2)})`);
      g.addColorStop(0.35, `rgba(255,246,200,${a*0.70})`);
      g.addColorStop(1,    'rgba(255,240,190,0)');
      c.fillStyle = g;
      c.beginPath(); c.arc(f.x, f.z, BALL_R*1.7, 0, Math.PI*2); c.fill();
    }
    // 冲击波圆环
    c.strokeStyle = `rgba(255,253,232,${a*0.95})`;
    c.lineWidth = 0.0042 * (1 - k) + 0.0007;
    c.beginPath(); c.arc(f.x, f.z, BALL_R * (0.30 + k*2.6), 0, Math.PI*2); c.stroke();

    // 迸射火花：7 根短线往外窜
    const rays = 7;
    const inner = BALL_R * (0.35 + k*0.9);
    const outer = inner + BALL_R * (0.55 + k*1.9) * f.p;
    c.strokeStyle = `rgba(255,250,215,${a*0.85})`;
    c.lineWidth = 0.0022 * (1 - k) + 0.0006;
    c.beginPath();
    for(let i = 0; i < rays; i++){
      const ang = f.seed + i * (Math.PI*2/rays) + k*0.5;
      const ca = Math.cos(ang), sa = Math.sin(ang);
      c.moveTo(f.x + ca*inner, f.z + sa*inner);
      c.lineTo(f.x + ca*outer, f.z + sa*outer);
    }
    c.stroke();
    c.restore();
  }
}

/* ══════════════════════════════════════════════════════════
   进球赞美：随机不重复，飘字上升
   ══════════════════════════════════════════════════════════ */
const PRAISE = [
  '漂亮！', '好球！', '这杆有点东西', '稳！', '干净利落', '进得真脆',
  '角度刁钻', '神仙球', '这杆值钱', '手感来了', '教科书级别', '没毛病',
  '赏心悦目', '一杆入魂', '这球会拐弯', '稳得一批', '利索！', '漂亮收杆',
  '这杆有味道', '准得像尺子', '走位也到位', '清脆！', '这手不抖', '进球如喝水',
  '可以啊老板', '这球懂你', '美如画', '这杆带感', '稳如老狗', '有点东西啊'
];
let praiseLastIdx = -1;
const praiseFx = [];

function addPraise(x, z){
  let idx = Math.floor(Math.random() * PRAISE.length);
  let guard = 0;
  while(idx === praiseLastIdx && guard++ < 12){
    idx = Math.floor(Math.random() * PRAISE.length);
  }
  praiseLastIdx = idx;
  // 同一发连进好几颗时往上错开，别叠成一坨
  const stack = praiseFx.filter(p => p.t < 0.55).length;
  praiseFx.push({
    x, z: z - stack * BALL_R * 1.35,
    text: PRAISE[idx], t: 0, life: 1.30
  });
  if(praiseFx.length > 6) praiseFx.shift();
}
function stepPraise(dt){
  for(let i = praiseFx.length - 1; i >= 0; i--){
    praiseFx[i].t += dt;
    if(praiseFx[i].t >= praiseFx[i].life) praiseFx.splice(i, 1);
  }
}
function drawPraise(c){
  setScreenTransform();
  for(const p of praiseFx){
    const k = p.t / p.life;
    const pt = worldToScreen(p.x, p.z);
    const rise = -k * 74;
    // 弹一下再稳下来
    const sc = k < 0.16 ? (0.45 + (k/0.16) * 0.85) : (1.30 - (k-0.16) * 0.20);
    const al = k < 0.12 ? (k/0.12) : Math.max(0, 1 - Math.pow((k-0.12)/0.88, 2.4));
    const fs = Math.max(13, 30 * sc);
    const yy = pt.y + rise;
    c.save();
    c.globalAlpha = Math.max(0, Math.min(1, al));
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.font = `900 ${fs}px -apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif`;
    c.lineJoin = 'round';
    c.lineWidth = Math.max(3, fs*0.17);
    c.strokeStyle = 'rgba(12,10,26,.88)';
    c.strokeText(p.text, pt.x, yy);
    const g = c.createLinearGradient(pt.x, yy - fs*0.62, pt.x, yy + fs*0.62);
    g.addColorStop(0,   '#fff8cc');
    g.addColorStop(0.45,'#ffd750');
    g.addColorStop(1,   '#ff9b3d');
    c.fillStyle = g;
    c.fillText(p.text, pt.x, yy);
    c.restore();
  }
}

/* ══════════════════════════════════════════════════════════
   物理
   ══════════════════════════════════════════════════════════ */
function stepPhysics(dt){
  let moving = false;
  const lx = HW - BALL_R, lz = HH - BALL_R;

  for(const b of balls){
    if(!b.alive) continue;
    if(b.wx === undefined){ b.wx = 0; b.wz = 0; b.wy = 0; }

    const sp = Math.hypot(b.vx, b.vz);
    /* 接触点速度 u = v + ω×r。
       台球真正的手感来自 u：u≠0 说明球在「打滑」，摩擦大；u=0 才是纯滚动，摩擦小。 */
    const ux = b.vx + b.wz*BALL_R;
    const uz = b.vz - b.wx*BALL_R;
    const us = Math.hypot(ux, uz);

    /* 落袋先于「是否静止」判断 —— 否则一颗正好停在袋口的球会永远卡住 */
    let potted = false;
    for(const [px, pz, pr] of POCKETS){
      if(Math.hypot(b.x - px, b.z - pz) < pr * 0.90){
        b.alive = false; b.vx = 0; b.vz = 0; b.wx = 0; b.wz = 0; b.wy = 0;
        addSink(b.x, b.z, b.n);
        addImpact(b.x, b.z, 0.95);
        if(b.n !== 0) addPraise(b.x, b.z);
        if(shotLog){
          shotLog.potted.push(b.n);
          if(b.n === 0) shotLog.cuePotted = true;
        }
        potted = true;
        break;
      }
    }
    if(potted) continue;

    if(sp < STOP_EPS && us < STOP_EPS*2.5){
      b.vx = 0; b.vz = 0; b.wx = 0; b.wz = 0;
      b.wy *= Math.max(0, 1 - 5*dt);
      if(Math.abs(b.wy) < 0.3) b.wy = 0;
      continue;
    }
    moving = true;

    if(us > SLIDE_EPS){
      /* ── 滑动阶段：减速快（μ_s），同时把线速度转成角速度 ──
         接触点速度以 3.5·μ·g 的速率衰减，这才是真实的减速曲线 */
      const a  = MU_SLIDE * G_ACC;
      const ex = ux/us, ez = uz/us;
      // 本步不能把 u 打过头，否则会在 0 附近来回震荡（表现为球小幅抖动）
      const dec = 3.5 * a * dt;
      const sc  = dec > us ? us/dec : 1;
      b.vx -= a * sc * ex * dt;
      b.vz -= a * sc * ez * dt;
      b.wz += -(2.5 * a * sc / BALL_R) * ex * dt;
      b.wx +=  (2.5 * a * sc / BALL_R) * ez * dt;
    } else {
      /* ── 纯滚动阶段：只有很小的滚动阻力，球能滚很远 ── */
      const a = MU_ROLL * G_ACC;
      if(sp > 1e-6){
        const ns = Math.max(0, sp - a*dt);
        b.vx = b.vx/sp*ns;
        b.vz = b.vz/sp*ns;
        b.wz = -b.vx / BALL_R;      // 纯滚：ω 锁死在 v 上
        b.wx =  b.vz / BALL_R;
      }
    }
    // 绕垂直轴的自转（左右塞）慢慢衰减
    b.wy *= Math.max(0, 1 - 1.5*dt);

    b.x += b.vx*dt;
    b.z += b.vz*dt;

    /* 滚动累计：让球的数字盘跟着滚起来（立体感的关键，光有渐变还是颗贴纸） */
    const moved = Math.hypot(b.vx, b.vz) * dt;
    if(moved > 1e-7){
      b.roll = (b.roll || 0) + moved / BALL_R;
      b.rollDir = Math.atan2(b.vz, b.vx);
    }
    /* 高速拖尾：慢速一帧一帧退，避免突然消失 */
    if(!b.trail) b.trail = [];
    const spx = Math.hypot(b.vx, b.vz);
    if(spx > 1.15){
      b.trail.unshift({ x: b.x, z: b.z, a: Math.min(1, (spx - 1.15) / 2.4) });
      if(b.trail.length > 7) b.trail.pop();
    } else if(b.trail.length){
      b.trail.pop();
    }

    // 库边（袋口附近不放库，让球能进袋）
    const nearPocketX = Math.abs(Math.abs(b.x) - HW) < PCK_CORNER*1.20;
    const nearPocketZ = Math.abs(Math.abs(b.z) - HH) < PCK_CORNER*1.20;

    let bounced = false;
    /* 库边：法向恢复(E_CUSH) + 切向摩擦(MU_CUSH) + 侧旋甩球
       —— 原来只做 vz *= -0.87，球贴库会「直直弹回」，这就是不真实的一半原因 */
    const cushiBounce = (nx, nz, vnAbs) => {
      const tx = -nz, tz = nx;
      const vt = b.vx*tx + b.vz*tz;
      // 切向摩擦最多吃掉 MU_CUSH*(1+e)*|vn|，吃不完就按比例
      const jtMax = MU_CUSH * (1 + E_CUSH) * vnAbs;
      const jt = Math.min(Math.abs(vt), jtMax) * Math.sign(vt || 1);
      // 绕垂直轴的自转（左右塞）会把球沿着库边甩出去
      const spur = b.wy * BALL_R * 0.32;
      const vtOut = vt - jt + spur;
      const vnOut = vnAbs * E_CUSH;
      b.vx = nx*vnOut + tx*vtOut;
      b.vz = nz*vnOut + tz*vtOut;
      b.wy *= 0.72;
    };
    if(b.x < -lx && !nearPocketZ){ b.x = -lx; cushiBounce( 1, 0, Math.abs(b.vx)); bounced = true; }
    if(b.x >  lx && !nearPocketZ){ b.x =  lx; cushiBounce(-1, 0, Math.abs(b.vx)); bounced = true; }
    if(b.z < -lz && !nearPocketX){ b.z = -lz; cushiBounce(0,  1, Math.abs(b.vz)); bounced = true; }
    if(b.z >  lz && !nearPocketX){ b.z =  lz; cushiBounce(0, -1, Math.abs(b.vz)); bounced = true; }
    // 撞库特效（比撞球淡，是「砰」一下不是「啪」一下）
    if(bounced){
      addImpact(b.x, b.z, Math.min(0.50, Math.hypot(b.vx, b.vz) / 5.5));
    }

  }

  // 球球碰撞
  for(let i = 0; i < balls.length; i++){
    const a = balls[i]; if(!a.alive) continue;
    for(let j = i+1; j < balls.length; j++){
      const b = balls[j]; if(!b.alive) continue;
      let dx = b.x - a.x, dz = b.z - a.z;
      let d = Math.hypot(dx, dz);
      const min = BALL_R*2;
      if(d === 0){ dx = 0.0001; d = 0.0001; }
      if(d >= min) continue;

      const nx = dx/d, nz = dz/d;
      const ov = min - d;
      a.x -= nx*ov*0.5; a.z -= nz*ov*0.5;
      b.x += nx*ov*0.5; b.z += nz*ov*0.5;

      const rvx = b.vx - a.vx, rvz = b.vz - a.vz;
      const vn = rvx*nx + rvz*nz;
      if(vn > 0) continue;

      if(a.wx === undefined){ a.wx = 0; a.wz = 0; a.wy = 0; }
      if(b.wx === undefined){ b.wx = 0; b.wz = 0; b.wy = 0; }

      /* ① 法向冲量：等质量弹性碰撞 */
      const jn = -(1 + E_BALL) * vn / 2;
      a.vx -= jn*nx; a.vz -= jn*nz;
      b.vx += jn*nx; b.vz += jn*nz;

      /* ② 切向冲量 = throw 效应
         真实球面有摩擦，接触点的切向速度不会全部保留：
         目标球会被「带」着偏一点，白球也会被拖一下。
         少了这一项，撞完永远是一条理想直线 —— 这就是「碰撞曲线不真实」的主因。 */
      const tx = -nz, tz = nx;
      const vt = rvx*tx + rvz*tz;
      const jtMax = MU_BALL * Math.abs(jn);
      let jt = -vt / 2;                        // 完全粘住所需要的冲量
      if(Math.abs(jt) > jtMax) jt = Math.sign(jt) * jtMax;
      a.vx -= jt*tx; a.vz -= jt*tz;
      b.vx += jt*tx; b.vz += jt*tz;
      // 切向摩擦顺带给两球一点反向自转
      a.wy -= jt * 2.8 / BALL_R * 0.28;
      b.wy += jt * 2.8 / BALL_R * 0.28;

      // 撞球特效（接触点，力度跟着相对速度走）
      if(-vn > 0.12){
        addImpact((a.x + b.x)/2, (a.z + b.z)/2, Math.min(1, -vn / 2.4));
      }

      if(shotLog && shotLog.firstHit === null){
        if(a.n === 0 && b.n !== 0) shotLog.firstHit = b.n;
        else if(b.n === 0 && a.n !== 0) shotLog.firstHit = a.n;
      }
    }
  }
  return moving;
}

/* ══════════════════════════════════════════════════════════
   预测：幽灵球 + 目标球走线 + 白球反弹
   ══════════════════════════════════════════════════════════ */
function predictShot(){
  const cb = cueBall();
  if(!cb || !cb.alive) return null;
  const dx = aimDir.x, dz = aimDir.z;

  let hitT = 12, hitBall = null;
  for(const b of balls){
    if(b === cb || !b.alive) continue;
    const ox = b.x - cb.x, oz = b.z - cb.z;
    const proj = ox*dx + oz*dz;
    if(proj <= 0) continue;
    const perp2 = (ox*ox + oz*oz) - proj*proj;
    const rr = BALL_R*2;
    if(perp2 > rr*rr) continue;
    const t = proj - Math.sqrt(rr*rr - perp2);
    if(t > 0 && t < hitT){ hitT = t; hitBall = b; }
  }

  // 库边
  let wallT = Infinity, wallN = null;
  const lx = HW - BALL_R, lz = HH - BALL_R;
  if(dx > 1e-6){ const t = (lx - cb.x)/dx; if(t > 0 && t < wallT){ wallT = t; wallN = {x:-1, z:0}; } }
  if(dx < -1e-6){ const t = (-lx - cb.x)/dx; if(t > 0 && t < wallT){ wallT = t; wallN = {x:1, z:0}; } }
  if(dz > 1e-6){ const t = (lz - cb.z)/dz; if(t > 0 && t < wallT){ wallT = t; wallN = {x:0, z:-1}; } }
  if(dz < -1e-6){ const t = (-lz - cb.z)/dz; if(t > 0 && t < wallT){ wallT = t; wallN = {x:0, z:1}; } }

  const useBall = hitBall && hitT < wallT;
  const end = useBall
    ? { x: cb.x + dx*hitT, z: cb.z + dz*hitT }
    : (isFinite(wallT) ? { x: cb.x + dx*wallT, z: cb.z + dz*wallT } : null);

  let target = null, reflect = null;
  if(useBall){
    // 撞击瞬间的目标球中心 → 幽灵球位置
    const gx = end.x, gz = end.z;
    let nx = hitBall.x - gx, nz = hitBall.z - gz;
    const nl = Math.hypot(nx, nz) || 1;
    nx /= nl; nz /= nl;
    // 目标球沿连线方向走
    target = { from:{x:hitBall.x, z:hitBall.z}, dir:{x:nx, z:nz} };
    // 白球沿切向偏折
    const dot = dx*nx + dz*nz;
    let tx = dx - nx*dot, tz = dz - nz*dot;
    const tl = Math.hypot(tx, tz);
    if(tl > 0.02) reflect = { from:{x:gx, z:gz}, dir:{x:tx/tl, z:tz/tl} };
  } else if(wallN){
    const rr = dx*wallN.x + dz*wallN.z;
    reflect = { from:end, dir:{ x: dx - 2*rr*wallN.x, z: dz - 2*rr*wallN.z } };
  }
  return { end, useBall, hitBall, target, reflect };
}

/* ══════════════════════════════════════════════════════════
   绘制：台子
   ══════════════════════════════════════════════════════════ */
/* 圆角矩形（每角半径可不同）：金属包角要靠"外角大、内角小"才像真袋口 */
function perCornerRect(c, x, y, w, h, rTL, rTR, rBR, rBL){
  const m = Math.min(w, h) / 2;
  rTL = Math.min(rTL, m); rTR = Math.min(rTR, m);
  rBR = Math.min(rBR, m); rBL = Math.min(rBL, m);
  c.beginPath();
  c.moveTo(x + rTL, y);
  c.lineTo(x + w - rTR, y);
  c.arcTo(x + w, y, x + w, y + rTR, rTR);
  c.lineTo(x + w, y + h - rBR);
  c.arcTo(x + w, y + h, x + w - rBR, y + h, rBR);
  c.lineTo(x + rBL, y + h);
  c.arcTo(x, y + h, x, y + h - rBL, rBL);
  c.lineTo(x, y + rTL);
  c.arcTo(x, y, x + rTL, y, rTL);
  c.closePath();
}

function roundRectPath(c, x, y, w, h, r){
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

/* 台呢绒布噪点 pattern：预生成一次，别每帧随机 */
let feltPat = null;
function getFeltPattern(c){
  if(feltPat) return feltPat;
  const S = 64;
  const off = document.createElement('canvas');
  off.width = off.height = S;
  const ox = off.getContext('2d');
  const img = ox.createImageData(S, S);
  for(let i = 0; i < S*S; i++){
    const r = Math.random();
    const a = r < 0.55 ? 0 : Math.floor(18 + Math.random()*46);
    img.data[i*4+0] = 0;
    img.data[i*4+1] = 10;
    img.data[i*4+2] = 4;
    img.data[i*4+3] = a;
  }
  ox.putImageData(img, 0, 0);
  feltPat = c.createPattern(off, 'repeat');
  return feltPat;
}

function drawTable(c){
  const ow = HW + RAIL_W, oh = HH + RAIL_W;

  /* ══ ① 桌子厚度 + 落地投影：纯俯视会「扁」，加一层侧壁立刻立体 ══ */
  const TH = 0.078;
  const sideG = c.createLinearGradient(0, oh - 0.02, 0, oh + TH);
  sideG.addColorStop(0,    '#6d3f18');
  sideG.addColorStop(0.20, '#4b2910');
  sideG.addColorStop(0.68, '#30190a');
  sideG.addColorStop(1,    '#1c0d05');
  c.fillStyle = sideG;
  roundRectPath(c, -ow + 0.014, oh - 0.030, (ow*2) - 0.028, TH, 0.016);
  c.fill();
  // 侧壁上沿磨光高光
  c.strokeStyle = 'rgba(255,208,152,.22)';
  c.lineWidth = 0.0036;
  c.beginPath(); c.moveTo(-ow + 0.032, oh - 0.026); c.lineTo(ow - 0.032, oh - 0.026); c.stroke();
  // 落到背景上的软阴影
  const dropG = c.createLinearGradient(0, oh + TH*0.35, 0, oh + TH + 0.30);
  dropG.addColorStop(0,    'rgba(0,0,0,.58)');
  dropG.addColorStop(0.40, 'rgba(0,0,0,.26)');
  dropG.addColorStop(1,    'rgba(0,0,0,0)');
  c.fillStyle = dropG;
  c.fillRect(-ow*0.96, oh + TH*0.35, ow*1.92, TH + 0.30);

  /* ══ ② 木框：真木纹（波浪线） + 四边倒角 ══ */
  const woodGrad = c.createLinearGradient(0, -oh, 0, oh);
  woodGrad.addColorStop(0,    '#9a6229');
  woodGrad.addColorStop(0.08, '#855122');
  woodGrad.addColorStop(0.38, '#633914');
  woodGrad.addColorStop(0.56, '#714218');
  woodGrad.addColorStop(0.90, '#8a5524');
  woodGrad.addColorStop(1,    '#4e2b10');
  c.fillStyle = woodGrad;
  roundRectPath(c, -ow, -oh, ow*2, oh*2, 0.050);
  c.fill();

  c.save();
  roundRectPath(c, -ow, -oh, ow*2, oh*2, 0.050);
  c.clip();
  // 直条纹一眼就是塑料，用不同频率的波浪叠加
  for(let i = 0; i < 22; i++){
    const base = -oh + (oh*2) * (i/22);
    const amp  = 0.004 + (i % 4)*0.0018;
    const dark = (i % 3 === 0);
    c.globalAlpha = dark ? 0.16 : 0.085;
    c.strokeStyle = dark ? '#351a05' : '#ffd9a4';
    c.lineWidth = dark ? 0.0055 : 0.0026;
    c.beginPath();
    for(let k = 0; k <= 44; k++){
      const x = -ow + (ow*2)*(k/44);
      const z = base
              + Math.sin(k*0.30 + i*1.73) * amp
              + Math.sin(k*0.11 + i*0.61) * amp*0.5;
      if(k === 0) c.moveTo(x, z); else c.lineTo(x, z);
    }
    c.stroke();
  }
  // 细密木纹：比主纹更细更淡，叠加出木头的密度感
  for(let i = 0; i < 78; i++){
    const base = -oh + (oh*2) * (i/78) + Math.sin(i*2.1)*0.003;
    c.globalAlpha = (i % 4 === 0) ? 0.055 : 0.030;
    c.strokeStyle = (i % 4 === 0) ? '#2a1203' : '#ffcf94';
    c.lineWidth = 0.0014;
    c.beginPath();
    for(let k = 0; k <= 30; k++){
      const x = -ow + (ow*2)*(k/30);
      const z = base + Math.sin(k*0.22 + i*2.7) * 0.0022;
      if(k === 0) c.moveTo(x, z); else c.lineTo(x, z);
    }
    c.stroke();
  }
  c.restore();

  // 倒角：上/左亮、下/右暗 → 立刻有厚度
  c.save();
  roundRectPath(c, -ow, -oh, ow*2, oh*2, 0.050);
  c.clip();
  const bT = c.createLinearGradient(0, -oh, 0, -oh + 0.030);
  bT.addColorStop(0, 'rgba(255,228,185,.36)'); bT.addColorStop(1, 'rgba(255,228,185,0)');
  c.fillStyle = bT; c.fillRect(-ow, -oh, ow*2, 0.030);
  const bB = c.createLinearGradient(0, oh - 0.030, 0, oh);
  bB.addColorStop(0, 'rgba(0,0,0,0)'); bB.addColorStop(1, 'rgba(0,0,0,.44)');
  c.fillStyle = bB; c.fillRect(-ow, oh - 0.030, ow*2, 0.030);
  const bL = c.createLinearGradient(-ow, 0, -ow + 0.024, 0);
  bL.addColorStop(0, 'rgba(255,228,185,.22)'); bL.addColorStop(1, 'rgba(255,228,185,0)');
  c.fillStyle = bL; c.fillRect(-ow, -oh, 0.024, oh*2);
  const bR = c.createLinearGradient(ow - 0.024, 0, ow, 0);
  bR.addColorStop(0, 'rgba(0,0,0,0)'); bR.addColorStop(1, 'rgba(0,0,0,.38)');
  c.fillStyle = bR; c.fillRect(ow - 0.024, -oh, 0.024, oh*2);
  c.restore();

  /* ══ ③ 库边（橡胶）：先铺一圈比台呢大的深绿，台呢盖上来就只剩个环 ══ */
  const CI = 0.032;
  const cushG = c.createLinearGradient(0, -HH - CI, 0, -HH - CI + CI*2);
  cushG.addColorStop(0,   '#176b45');
  cushG.addColorStop(0.45,'#0d4c2f');
  cushG.addColorStop(1,   '#08351f');
  c.fillStyle = cushG;
  roundRectPath(c, -HW - CI, -HH - CI, (HW+CI)*2, (HH+CI)*2, 0.022);
  c.fill();
  // 库边外缘（贴木框那圈）压暗，做出凹下去的缝
  c.save();
  c.strokeStyle = 'rgba(0,0,0,.42)';
  c.lineWidth = 0.0045;
  roundRectPath(c, -HW - CI + 0.002, -HH - CI + 0.002, (HW+CI)*2 - 0.004, (HH+CI)*2 - 0.004, 0.021);
  c.stroke();
  c.restore();

  /* ══ ④ 台呢：顶灯照明 + 绒布噪点 ══ */
  const felt = c.createRadialGradient(-HW*0.18, -HH*0.26, 0.08, 0, 0, TABLE_W*0.76);
  felt.addColorStop(0,    '#39d089');
  felt.addColorStop(0.42, '#27b06e');
  felt.addColorStop(0.78, '#1a9158');
  felt.addColorStop(1,    '#0f6b3f');
  c.fillStyle = felt;
  c.fillRect(-HW, -HH, TABLE_W, TABLE_H);

  // 绒布噪点
  c.save();
  const pat = getFeltPattern(c);
  if(pat){
    try{
      const m = new DOMMatrix();
      m.a = 0.010; m.d = 0.010;          // 把 pattern 缩到绒布尺度
      if(pat.setTransform) pat.setTransform(m);
    }catch(e){}
    c.globalAlpha = 0.28;
    c.fillStyle = pat;
    c.fillRect(-HW, -HH, TABLE_W, TABLE_H);
  }
  c.restore();

  // 库边压在台呢上的影子（内缘一圈暗）—— 这一步让库边「立」起来
  c.save();
  const inner = 0.026;
  const eT = c.createLinearGradient(0, -HH, 0, -HH + inner);
  eT.addColorStop(0, 'rgba(0,28,16,.55)'); eT.addColorStop(1, 'rgba(0,28,16,0)');
  c.fillStyle = eT; c.fillRect(-HW, -HH, TABLE_W, inner);
  const eB = c.createLinearGradient(0, HH - inner, 0, HH);
  eB.addColorStop(0, 'rgba(0,28,16,0)'); eB.addColorStop(1, 'rgba(0,28,16,.55)');
  c.fillStyle = eB; c.fillRect(-HW, HH - inner, TABLE_W, inner);
  const eL = c.createLinearGradient(-HW, 0, -HW + inner, 0);
  eL.addColorStop(0, 'rgba(0,28,16,.50)'); eL.addColorStop(1, 'rgba(0,28,16,0)');
  c.fillStyle = eL; c.fillRect(-HW, -HH, inner, TABLE_H);
  const eR = c.createLinearGradient(HW - inner, 0, HW, 0);
  eR.addColorStop(0, 'rgba(0,28,16,0)'); eR.addColorStop(1, 'rgba(0,28,16,.50)');
  c.fillStyle = eR; c.fillRect(HW - inner, -HH, inner, TABLE_H);
  c.restore();

  // 台呢中缝
  c.save();
  c.globalAlpha = 0.085;
  c.strokeStyle = '#04150c';
  c.lineWidth = 0.0035;
  c.beginPath(); c.moveTo(0, -HH); c.lineTo(0, HH); c.stroke();
  c.restore();

  /* ══ ⑤ 顶灯：中间亮、四周微暗，整张台面才有「被打光」的感觉 ══ */
  c.save();
  c.beginPath(); c.rect(-HW, -HH, TABLE_W, TABLE_H); c.clip();
  const lamp = c.createRadialGradient(-HW*0.12, -HH*0.22, 0.02, 0, 0, TABLE_W*0.64);
  lamp.addColorStop(0,    'rgba(255,255,235,.16)');
  lamp.addColorStop(0.42, 'rgba(255,255,235,.05)');
  lamp.addColorStop(0.78, 'rgba(0,18,10,.07)');
  lamp.addColorStop(1,    'rgba(0,16,9,.20)');
  c.fillStyle = lamp;
  c.fillRect(-HW, -HH, TABLE_W, TABLE_H);
  c.restore();

  /* 库边钻石点 */
  c.fillStyle = 'rgba(255,255,255,.75)';
  for(let i = -3; i <= 3; i++){
    if(i === 0) continue;
    const x = i * (HW/4);
    // 上下库
    for(const zz of [-HH - RAIL_W*0.5, HH + RAIL_W*0.5]){
      c.beginPath(); c.arc(x, zz, 0.0075, 0, Math.PI*2); c.fill();
    }
  }
  for(let i = -1; i <= 1; i++){
    if(i === 0) continue;
    const z = i * (HH/2);
    for(const xx of [-HW - RAIL_W*0.5, HW + RAIL_W*0.5]){
      c.beginPath(); c.arc(xx, z, 0.0075, 0, Math.PI*2); c.fill();
    }
  }

  /* ── 袋口：金属包角 = 圆角板 − 椭圆洞（evenodd）──
     关键：内缘直接等于洞的轮廓，所以不可能出现「白色方框里包个蛋、四角还露着」 */
  const OUT_W    = RAIL_W + 0.002;     // 金属外缘和桌子外沿齐平，不甩出去
  const R_OUT    = 0.040;              // 外角圆角（原来 0.085 太肿）
  const R_IN     = 0.009;
  // 洞半径按每个袋口自己的开口算（下面循环里 per-pocket 取值）
  
  for(const [px, pz, pr] of POCKETS){
    const isCorner = (px !== 0);
    const sx = isCorner ? Math.sign(px) : 0;
    const sz = Math.sign(pz);
    // 洞心压在台角 / 库边线上：洞比金属略大，外圈留一圈窄边
    const hx = px, hz = pz;
    const HR = pr * 0.98;
    const PLATE_IN = HR * 0.62;   // 金属向台内伸多少（必须 < 0.707*HR，内角才被圆吃掉）
    const rx = HR, rz = HR;    // 六个袋口全都是正圆（中袋不是扁的）

    c.save();

    /* 1) 板子轮廓 */
    if(isCorner){
      // 角袋：方板，外缘和桌子外沿齐平，内侧伸一点到台呢上
      const x0 = Math.min(hx - sx*PLATE_IN, hx + sx*OUT_W);
      const x1 = Math.max(hx - sx*PLATE_IN, hx + sx*OUT_W);
      const z0 = Math.min(hz - sz*PLATE_IN, hz + sz*OUT_W);
      const z1 = Math.max(hz - sz*PLATE_IN, hz + sz*OUT_W);
      const rBR = (sx > 0 && sz > 0) ? R_OUT : R_IN;
      const rBL = (sx < 0 && sz > 0) ? R_OUT : R_IN;
      const rTR = (sx > 0 && sz < 0) ? R_OUT : R_IN;
      const rTL = (sx < 0 && sz < 0) ? R_OUT : R_IN;
      perCornerRect(c, x0, z0, x1-x0, z1-z0, rTL, rTR, rBR, rBL);
    } else {
      // 中袋：内缘正好压在台呢边线上（一点不压绿布），沿库横向一段
      const z0 = Math.min(pz, pz + sz*OUT_W);
      const z1 = Math.max(pz, pz + sz*OUT_W);
      roundRectPath(c, -0.078, z0, 0.156, z1-z0, 0.012);
    }

    /* 2) 减去洞 → 包角内缘变成圆弧 */
    c.moveTo(hx + rx, hz);
    c.ellipse(hx, hz, rx, rz, 0, 0, Math.PI*2, true);

    // 投影
    c.save();
    c.translate(0.007, 0.008);
    c.fillStyle = 'rgba(0,0,0,.34)';
    c.fill('evenodd');
    c.restore();

    // 金属面：拉丝钢（左上亮、右下暗，中间再亮一道，才有金属的「反射带」）
    const mg = c.createLinearGradient(
      hx - OUT_W, hz - OUT_W,
      hx + OUT_W*0.55, hz + OUT_W*0.55);
    mg.addColorStop(0,    '#9fb0c2');
    mg.addColorStop(0.10, '#f2f6fa');
    mg.addColorStop(0.30, '#bccbda');
    mg.addColorStop(0.52, '#8b97a5');
    mg.addColorStop(0.72, '#d3dce5');
    mg.addColorStop(0.88, '#7b8794');
    mg.addColorStop(1,    '#4e5b6a');
    c.fillStyle = mg;
    c.fill('evenodd');
    c.strokeStyle = 'rgba(26,34,44,.65)';
    c.lineWidth = 0.0032;
    c.stroke();

    // 拉丝纹理：两组反向的平行细线，clip 在金属面里
    c.save();
    c.clip('evenodd');
    for(const [col, alp, ph] of [['#ffffff', .07, 0], ['#2a3540', .055, 0.0055]]){
      c.globalAlpha = alp;
      c.strokeStyle = col;
      c.lineWidth = 0.0011;
      for(let k = -9; k <= 9; k++){
        const off = k * 0.0105 + ph;
        c.beginPath();
        c.moveTo(hx - OUT_W, hz - OUT_W + off);
        c.lineTo(hx + OUT_W, hz + OUT_W + off);
        c.stroke();
      }
    }
    c.globalAlpha = 1;
    c.restore();

    // 内缘高光（裁剪到金属面上，往左上偏一点）
    c.save();
    c.clip('evenodd');
    c.strokeStyle = 'rgba(255,255,255,.7)';
    c.lineWidth = 0.0045;
    c.translate(-0.0035, -0.0040);
    c.stroke();
    c.restore();

    /* 3) 洞：几乎纯黑 + 极细的洞沿过渡
       金属/台呢上画一个带中心渐变的圆、再加一条弧形高光，那看起来永远像一颗黑球，
       不像洞 —— 真实袋口从上往下看就是纯黑的。 */
    // 洞沿外圈的阴影
    const shg = c.createRadialGradient(hx, hz, rx*0.90, hx, hz, rx*1.38);
    shg.addColorStop(0, 'rgba(0,0,0,.46)');
    shg.addColorStop(1, 'rgba(0,0,0,0)');
    c.beginPath(); c.arc(hx, hz, rx*1.38, 0, Math.PI*2);
    c.fillStyle = shg; c.fill();

    // 洞体：0~88% 全黑，最后一点才透出洞沿
    const hg = c.createRadialGradient(hx, hz, 0, hx, hz, rx*1.005);
    hg.addColorStop(0,    '#000000');
    hg.addColorStop(0.90, '#020101');
    hg.addColorStop(0.975,'#0a0603');
    hg.addColorStop(1,    '#17100a');
    c.beginPath();
    c.ellipse(hx, hz, rx*1.005, rz*1.005, 0, 0, Math.PI*2);
    c.fillStyle = hg;
    c.fill();

    c.restore();
  }

  /* 库边金属铆钉（参考图里每段木库上都有） */
  c.save();
  for(let i = -3; i <= 3; i++){
    if(i === 0) continue;
    const x = i * (HW/4);
    for(const zz of [-HH - RAIL_W*0.72, HH + RAIL_W*0.72]){
      const rg = c.createRadialGradient(x - 0.004, zz - 0.004, 0.0005, x, zz, 0.010);
      rg.addColorStop(0, '#ffffff');
      rg.addColorStop(0.5, '#c8d0d8');
      rg.addColorStop(1, '#6b747e');
      c.fillStyle = rg;
      c.beginPath(); c.arc(x, zz, 0.0085, 0, Math.PI*2); c.fill();
    }
  }
  for(const xx of [-HW - RAIL_W*0.72, HW + RAIL_W*0.72]){
    for(const zz of [-HH*0.5, HH*0.5]){
      const rg = c.createRadialGradient(xx - 0.004, zz - 0.004, 0.0005, xx, zz, 0.010);
      rg.addColorStop(0, '#ffffff');
      rg.addColorStop(0.5, '#c8d0d8');
      rg.addColorStop(1, '#6b747e');
      c.fillStyle = rg;
      c.beginPath(); c.arc(xx, zz, 0.0085, 0, Math.PI*2); c.fill();
    }
  }
  c.restore();
}

/* ── 球 ── */
/* 颜色明暗工具：k<=1 变暗，k>1 变亮 */
function shade(hex, k){
  let h = String(hex).replace('#','');
  if(h.length === 3) h = h.split('').map(ch => ch+ch).join('');
  const ri = parseInt(h.slice(0,2),16), gi = parseInt(h.slice(2,4),16), bi = parseInt(h.slice(4,6),16);
  const f = v => Math.max(0, Math.min(255, Math.round(k <= 1 ? v*k : v + (255-v)*(k-1))));
  return `rgb(${f(ri)},${f(gi)},${f(bi)})`;
}

function drawBall(c, b){
  const col = COLORS[b.n] || '#888';
  const r = BALL_R;
  const striped = b.n > 8;

  /* ① 高速拖尾（残影） */
  if(b.trail && b.trail.length > 1){
    for(let i = 1; i < b.trail.length; i++){
      const t = b.trail[i];
      const a = (1 - i/b.trail.length) * 0.42 * t.a;
      if(a <= 0.01) continue;
      c.save();
      c.globalAlpha = a;
      c.fillStyle = b.n === 0 ? '#fffdf4' : col;
      const rr = r * (1 - i*0.055);
      c.beginPath(); c.arc(t.x, t.z, rr, 0, Math.PI*2); c.fill();
      c.restore();
    }
  }

  /* ② 接触阴影：多层径向渐变，比单个硬椭圆柔和得多 */
  c.save();
  const sg = c.createRadialGradient(
    b.x + r*0.08, b.z + r*0.20, r*0.10,
    b.x + r*0.14, b.z + r*0.30, r*1.45);
  sg.addColorStop(0,    'rgba(0,14,8,.50)');
  sg.addColorStop(0.42, 'rgba(0,14,8,.26)');
  sg.addColorStop(0.75, 'rgba(0,14,8,.09)');
  sg.addColorStop(1,    'rgba(0,14,8,0)');
  c.fillStyle = sg;
  c.beginPath();
  c.ellipse(b.x + r*0.14, b.z + r*0.30, r*1.36, r*1.14, 0, 0, Math.PI*2);
  c.fill();
  c.restore();

  /* ③ 球体 */
  c.save();
  c.beginPath(); c.arc(b.x, b.z, r, 0, Math.PI*2); c.clip();

  if(b.n === 0){
    /* 白球不是纯白：真实台球是象牙白 + 一层蜡质光泽 */
    const bg = c.createLinearGradient(b.x - r*0.3, b.z - r, b.x + r*0.3, b.z + r);
    bg.addColorStop(0,    '#ffffff');
    bg.addColorStop(0.30, '#fbf7ec');
    bg.addColorStop(0.62, '#eee8d8');
    bg.addColorStop(1,    '#c8c1ad');
    c.fillStyle = bg;
    c.fillRect(b.x - r, b.z - r, r*2, r*2);

    /* 表面微瑕：几个极淡的斑点，随滚动在球面上移动。
       没有这个，白球平移时整块明暗一起走，看起来就是一坨圆圈在滑。 */
    const ph0  = b.roll || 0;
    const dir0 = b.rollDir || 0;
    for(let i = 0; i < 3; i++){
      const q    = ph0 + i*2.094;
      const face = Math.cos(q);                 // 1=正对镜头，-1=转到背面
      if(face < 0.15) continue;                 // 背面就不画
      const along = Math.sin(q) * r * 0.60;     // 沿滚动方向位移
      const ox = b.x + Math.cos(dir0) * along;
      const oz = b.z + Math.sin(dir0) * along;
      const rad = r * (0.17 + face*0.10);
      const g2 = c.createRadialGradient(ox, oz, 0, ox, oz, rad);
      g2.addColorStop(0, `rgba(202,192,168,${(0.11*face).toFixed(3)})`);
      g2.addColorStop(1, 'rgba(202,192,168,0)');
      c.fillStyle = g2;
      c.beginPath(); c.arc(ox, oz, rad, 0, Math.PI*2); c.fill();
    }
  } else if(striped){
    // 白底 + 中间色带（色带本身也有明暗，不然是死板的一条）
    c.fillStyle = '#f8f5ec';
    c.fillRect(b.x - r, b.z - r, r*2, r*2);
    const bg = c.createLinearGradient(0, b.z - r*0.58, 0, b.z + r*0.58);
    bg.addColorStop(0,   shade(col, 0.72));
    bg.addColorStop(0.42, col);
    bg.addColorStop(1,   shade(col, 0.52));
    c.fillStyle = bg;
    c.fillRect(b.x - r, b.z - r*0.58, r*2, r*1.16);
  } else {
    const bg = c.createLinearGradient(0, b.z - r, 0, b.z + r);
    bg.addColorStop(0,   shade(col, 0.80));
    bg.addColorStop(0.42, col);
    bg.addColorStop(1,   shade(col, 0.48));
    c.fillStyle = bg;
    c.fillRect(b.x - r, b.z - r, r*2, r*2);
  }

  /* ④ 球面明暗：左上亮 → 中间透 → 右下压暗，右侧一圈反光 */
  const sh = c.createRadialGradient(
    b.x - r*0.40, b.z - r*0.45, r*0.03,
    b.x - r*0.06, b.z - r*0.03, r*1.24);
  sh.addColorStop(0,    'rgba(255,255,255,.88)');
  sh.addColorStop(0.15, 'rgba(255,255,255,.30)');
  sh.addColorStop(0.46, 'rgba(255,255,255,0)');
  sh.addColorStop(0.72, 'rgba(0,0,0,.18)');
  sh.addColorStop(0.90, 'rgba(0,0,0,.46)');
  sh.addColorStop(1,    'rgba(0,0,0,.66)');
  c.fillStyle = sh;
  c.fillRect(b.x - r, b.z - r, r*2, r*2);

  // 右下角环境反光（台呢的绿光 + 顶灯冷光）
  const rf = c.createRadialGradient(
    b.x + r*0.44, b.z + r*0.48, 0,
    b.x + r*0.44, b.z + r*0.48, r*0.62);
  rf.addColorStop(0, 'rgba(150,220,255,.26)');
  rf.addColorStop(1, 'rgba(150,220,255,0)');
  c.fillStyle = rf;
  c.fillRect(b.x - r, b.z - r, r*2, r*2);

  /* ⑤ 镜面反射：顶灯倒影带 + 锐利主高光 + 次高光
     —— 主高光原来给到 r*0.42 的大柔光，那是「磨砂球」；
        抛光球的特征是「小而锐的亮点」，这才是质感的来源。 */
  // 顶灯倒影：球上半部一条横向亮带（灯管的倒影）
  const lampY = b.z - r*0.58;
  const lampRef = c.createLinearGradient(0, lampY - r*0.26, 0, lampY + r*0.26);
  lampRef.addColorStop(0,    'rgba(255,255,255,0)');
  lampRef.addColorStop(0.42, 'rgba(255,255,255,.30)');
  lampRef.addColorStop(0.58, 'rgba(255,255,255,.24)');
  lampRef.addColorStop(1,    'rgba(255,255,255,0)');
  c.fillStyle = lampRef;
  c.beginPath();
  c.ellipse(b.x - r*0.08, lampY, r*0.62, r*0.26, 0, 0, Math.PI*2);
  c.fill();

  // 主高光：小而锐
  const hx = b.x - r*0.34, hz = b.z - r*0.44;
  const hl = c.createRadialGradient(hx, hz, 0, hx, hz, r*0.21);
  hl.addColorStop(0,    'rgba(255,255,255,1)');
  hl.addColorStop(0.50, 'rgba(255,255,255,.88)');
  hl.addColorStop(1,    'rgba(255,255,255,0)');
  c.fillStyle = hl;
  c.beginPath(); c.arc(hx, hz, r*0.21, 0, Math.PI*2); c.fill();

  // 主高光外的柔晕（有它才像「一层蜡」而不是一个白点）
  const halo = c.createRadialGradient(hx, hz, r*0.15, hx, hz, r*0.50);
  halo.addColorStop(0, 'rgba(255,255,255,.26)');
  halo.addColorStop(1, 'rgba(255,255,255,0)');
  c.fillStyle = halo;
  c.beginPath(); c.arc(hx, hz, r*0.50, 0, Math.PI*2); c.fill();

  // 次高光小点
  c.fillStyle = 'rgba(255,255,255,.88)';
  c.beginPath(); c.arc(b.x + r*0.32, b.z - r*0.30, r*0.062, 0, Math.PI*2); c.fill();

  c.restore();

  /* ⑥ 轮廓 */
  c.strokeStyle = 'rgba(0,0,0,.20)';
  c.lineWidth = 0.0015;
  c.beginPath(); c.arc(b.x, b.z, r*0.985, 0, Math.PI*2); c.stroke();

  /* ⑦ 数字盘：跟着球的滚动一起位移、缩小、淡出（转到背面就看不见） */
  b._disc = null;
  if(b.n !== 0){
    const roll = b.roll || 0;
    const dir  = b.rollDir || 0;
    const cr = Math.cos(roll);
    if(cr > 0.10){
      const off = Math.sin(roll) * r * 0.74;
      const ox  = Math.cos(dir) * off;
      const oz  = Math.sin(dir) * off;
      const sc  = 0.74 + 0.26 * cr;
      const dr  = r * 0.52 * sc;
      const al  = Math.min(1, 0.35 + cr * 0.80);
      b._disc = { ox, oz, dr, al };

      c.save();
      c.beginPath(); c.arc(b.x, b.z, r*0.985, 0, Math.PI*2); c.clip();
      c.globalAlpha = al;
      // 盘底（带一点点渐变，不是死白圆）
      const dg = c.createRadialGradient(
        b.x + ox - dr*0.3, b.z + oz - dr*0.3, dr*0.1,
        b.x + ox, b.z + oz, dr*1.05);
      dg.addColorStop(0, '#fffefb');
      dg.addColorStop(0.7, '#f7f3e8');
      dg.addColorStop(1, '#ddd6c4');
      c.fillStyle = dg;
      c.beginPath(); c.arc(b.x + ox, b.z + oz, dr, 0, Math.PI*2); c.fill();
      c.strokeStyle = 'rgba(0,0,0,.22)';
      c.lineWidth = 0.0013;
      c.stroke();
      c.restore();
    }
  }
}

/* 数字单独在屏幕坐标系里画，保证竖屏旋转后也是正的 */
function drawBallNumbers(c){
  setScreenTransform();
  for(const b of balls){
    if(!b.alive || b.n === 0) continue;
    const d = b._disc;
    if(!d) continue;                       // 转到背面就不画
    const p = worldToScreen(b.x + d.ox, b.z + d.oz);
    const rad = BALL_R * SCALE;
    const k = d.dr / (BALL_R * 0.52);      // 盘缩小了多少，字号跟着缩
    const fs = Math.max(5, rad * (b.n >= 10 ? 0.80 : 1.02) * k);
    c.save();
    c.globalAlpha = d.al;
    c.fillStyle = '#151515';
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.font = `900 ${fs}px -apple-system,"Helvetica Neue",Arial,sans-serif`;
    c.fillText(String(b.n), p.x, p.y + fs*0.04);
    c.restore();
  }
}

/* 把预测线裁剪在台面内，别画到库边外面去 */
function clampToTable(x, z, dx, dz, maxLen){
  let t = maxLen;
  const lx = HW - BALL_R, lz = HH - BALL_R;
  if(dx >  1e-6) t = Math.min(t, ( lx - x)/dx);
  if(dx < -1e-6) t = Math.min(t, (-lx - x)/dx);
  if(dz >  1e-6) t = Math.min(t, ( lz - z)/dz);
  if(dz < -1e-6) t = Math.min(t, (-lz - z)/dz);
  return Math.max(0, t);
}

/* ── 白球选中圈：框住球本身，不是框在杆尾 ── */
function drawCueBallRing(c, cb, strong){
  const t = performance.now();
  const pulse = strong ? 1 + Math.sin(t*0.006)*0.10 : 1;
  const R = BALL_R * (strong ? 1.85 : 1.55) * pulse;
  c.save();
  // 外圈（发光）
  c.globalAlpha = strong ? 0.95 : 0.42;
  c.strokeStyle = strong ? '#ffffff' : 'rgba(255,255,255,.9)';
  c.lineWidth = strong ? 0.0080 : 0.0048;
  c.beginPath(); c.arc(cb.x, cb.z, R, 0, Math.PI*2); c.stroke();
  // 内圈（贴球一圈，明确"框住的是这颗球"）
  c.globalAlpha = strong ? 0.85 : 0.55;
  c.lineWidth = 0.0032;
  c.beginPath(); c.arc(cb.x, cb.z, BALL_R*1.16, 0, Math.PI*2); c.stroke();
  c.restore();
}

/* ── 瞄准辅助：幽灵球 + 目标球走向 + 白球分离 ── */
function drawAim(c){
  const cb = cueBall();
  if(!cb || !cb.alive) return;

  const idle = (!shooting && !gameOver && !placing && !ballInHand);

  // 白球选中圈：平时淡淡一圈，拖拽摆位时加粗脉冲
  drawCueBallRing(c, cb, placing || ballInHand);

  // 练习模式：把"下一个该打的球"用柔光框出来
  if(!gameOver && !placing){
    const nb = nextTargetBall();
    if(nb && nb !== cb){
      c.save();
      c.globalAlpha = 0.30 + Math.sin(performance.now()*0.004)*0.14;
      c.strokeStyle = '#ffd76b';
      c.lineWidth = 0.0042;
      c.beginPath(); c.arc(nb.x, nb.z, BALL_R*1.75, 0, Math.PI*2); c.stroke();
      c.restore();
    }
  }

  if(!idle) return;   // 摆白球时不画瞄准线

  const p = predictShot();
  if(!p || !p.end) return;

  // 拖动范围大圆
  if(power > 0.02){
    c.save();
    c.globalAlpha = 0.35;
    c.strokeStyle = 'rgba(180,255,210,.55)';
    c.lineWidth = 0.004;
    c.beginPath(); c.arc(cb.x, cb.z, BALL_R*4.2, 0, Math.PI*2); c.stroke();
    c.restore();
  }

  // 主瞄准线
  c.save();
  c.strokeStyle = 'rgba(230,255,240,.92)';
  c.lineWidth = 0.0055;
  c.setLineDash([0.035, 0.026]);
  c.beginPath();
  c.moveTo(cb.x + aimDir.x*BALL_R, cb.z + aimDir.z*BALL_R);
  c.lineTo(p.end.x, p.end.z);
  c.stroke();
  c.restore();

  if(p.useBall && p.hitBall){
    const t = p.hitBall;

    // 幽灵球（白球撞上去那一刻的位置）
    c.save();
    c.strokeStyle = 'rgba(255,255,255,.85)';
    c.lineWidth = 0.0035;
    c.beginPath(); c.arc(p.end.x, p.end.z, BALL_R, 0, Math.PI*2); c.stroke();
    c.globalAlpha = 0.14;
    c.fillStyle = '#ffffff';
    c.fill();
    c.restore();

    // 目标球走线
    if(p.target){
      const L = Math.min(0.55, clampToTable(p.target.from.x, p.target.from.z,
                                            p.target.dir.x, p.target.dir.z, 0.55));
      c.save();
      c.strokeStyle = 'rgba(255,214,107,.95)';
      c.lineWidth = 0.0055;
      c.beginPath();
      c.moveTo(p.target.from.x, p.target.from.z);
      c.lineTo(p.target.from.x + p.target.dir.x*L, p.target.from.z + p.target.dir.z*L);
      c.stroke();
      // 箭头
      const ex = p.target.from.x + p.target.dir.x*L;
      const ez = p.target.from.z + p.target.dir.z*L;
      c.fillStyle = 'rgba(255,214,107,.95)';
      c.beginPath();
      c.moveTo(ex, ez);
      c.lineTo(ex - p.target.dir.x*0.035 - p.target.dir.z*0.020,
               ez - p.target.dir.z*0.035 + p.target.dir.x*0.020);
      c.lineTo(ex - p.target.dir.x*0.035 + p.target.dir.z*0.020,
               ez - p.target.dir.z*0.035 - p.target.dir.x*0.020);
      c.closePath(); c.fill();
      c.restore();
    }

    // 白球分离方向
    if(p.reflect){
      const L = Math.min(0.30, clampToTable(p.reflect.from.x, p.reflect.from.z,
                                            p.reflect.dir.x, p.reflect.dir.z, 0.30));
      if(L > 0.012){
        c.save();
        c.strokeStyle = 'rgba(150,220,255,.75)';
        c.lineWidth = 0.0042;
        c.setLineDash([0.022, 0.020]);
        c.beginPath();
        c.moveTo(p.reflect.from.x, p.reflect.from.z);
        c.lineTo(p.reflect.from.x + p.reflect.dir.x*L, p.reflect.from.z + p.reflect.dir.z*L);
        c.stroke();
        c.restore();
      }
    }
  } else if(p.reflect){
    // 撞库反弹
    const L = Math.min(0.42, clampToTable(p.reflect.from.x, p.reflect.from.z,
                                          p.reflect.dir.x, p.reflect.dir.z, 0.42));
    if(L > 0.012){
      c.save();
      c.strokeStyle = 'rgba(150,220,255,.70)';
      c.lineWidth = 0.0042;
      c.setLineDash([0.022, 0.020]);
      c.beginPath();
      c.moveTo(p.reflect.from.x, p.reflect.from.z);
      c.lineTo(p.reflect.from.x + p.reflect.dir.x*L, p.reflect.from.z + p.reflect.dir.z*L);
      c.stroke();
      c.restore();
    }
  }
}

/* 球杆：木杆。白圈已经框住白球了，杆尾不再画圈（之前那个圆圈让人误会） */
function drawCue(c){
  const cb = cueBall();
  if(!cb || !cb.alive) return;
  if(shooting || gameOver || placing) return;   // 摆白球时不该看到杆

  const back = BALL_R + 0.008 + power*0.30;
  const LEN  = 0.98;

  const ax = -aimDir.x, az = -aimDir.z;         // 杆在球后方
  const px = -az, pz = ax;                      // 垂直于杆（做圆柱明暗）
  const tipX = cb.x + ax*back,  tipZ = cb.z + az*back;
  const buttX = tipX + ax*LEN,  buttZ = tipZ + az*LEN;

  // t=0 杆头 → t=1 杆尾
  const at = (t) => ({
    x: tipX + (buttX - tipX)*t,
    z: tipZ + (buttZ - tipZ)*t,
    w: 0.0142 + t*0.0238        // 杆头 14mm → 杆尾 38mm（真实 10/30，略放大才看得见质感）
  });

  const quad = (a, b) => {      // 一段杆的梯形路径
    const h0 = a.w/2, h1 = b.w/2;
    c.beginPath();
    c.moveTo(a.x + px*h0, a.z + pz*h0);
    c.lineTo(b.x + px*h1, b.z + pz*h1);
    c.lineTo(b.x - px*h1, b.z - pz*h1);
    c.lineTo(a.x - px*h0, a.z - pz*h0);
    c.closePath();
  };

  c.save();

  /* ① 杆投在台呢上的影子 */
  c.save();
  c.globalAlpha = 0.32;
  c.strokeStyle = '#00180d';
  c.lineCap = 'butt';
  for(let i = 0; i < 24; i++){
    const a = at(i/24), b = at((i+1)/24);
    c.lineWidth = b.w;
    c.beginPath();
    c.moveTo(a.x + 0.010, a.z + 0.014);
    c.lineTo(b.x + 0.010, b.z + 0.014);
    c.stroke();
  }
  c.restore();

  /* ② 主体：分段【梯形填充】。
     之前用分段 stroke，lineCap 圆头会在每段端点堆出一个圆点，
     整根杆看起来像一串珠子 —— 梯形填充就没有这个问题。 */
  const SEG = 64;
  const bandColor = (t) => {
    if(t < 0.028) return '#33445a';            // 皮头（蓝灰牛皮）
    if(t < 0.066) return '#f6f1e6';            // 白箍（象牙）
    if(t < 0.076) return '#c9a35c';            // 接口金属环
    if(t < 0.545) return null;                 // 前节（浅枫木）
    if(t < 0.570) return '#bb9649';            // 中环（黄铜）
    if(t < 0.955) return null;                 // 后节（深胡桃）
    return '#22222c';                          // 尾帽（橡胶）
  };

  for(let i = 0; i < SEG; i++){
    const t0 = i/SEG, t1 = (i+1)/SEG, tm = (t0+t1)/2;
    let col = bandColor(tm);
    if(col === null){
      col = tm < 0.545
        ? mix('#f4e0c0', '#c8a172', (tm - 0.076)/(0.545 - 0.076))
        : mix('#7a4a22', '#2f1708', (tm - 0.570)/(0.955 - 0.570));
    }
    quad(at(t0), at(t1));
    c.fillStyle = col;
    c.fill();
  }

  /* ③ 圆柱明暗：整根杆一条渐变覆盖下去，连续、没有接缝 */
  c.save();
  quad(at(0), at(1));
  c.clip();
  {
    const a = at(0), h = a.w/2;
    const cyl = c.createLinearGradient(
      a.x + px*h, a.z + pz*h,
      a.x - px*h, a.z - pz*h);
    cyl.addColorStop(0,    'rgba(0,0,0,.52)');
    cyl.addColorStop(0.15, 'rgba(255,255,255,.46)');
    cyl.addColorStop(0.33, 'rgba(255,255,255,.13)');
    cyl.addColorStop(0.60, 'rgba(255,255,255,0)');
    cyl.addColorStop(0.86, 'rgba(0,0,0,.24)');
    cyl.addColorStop(1,    'rgba(0,0,0,.58)');
    c.fillStyle = cyl;
    const x0 = Math.min(tipX, buttX) - 0.08, z0 = Math.min(tipZ, buttZ) - 0.08;
    c.fillRect(x0, z0, Math.abs(buttX - tipX) + 0.16, Math.abs(buttZ - tipZ) + 0.16);
  }

  /* ④ 前节木纹：几条沿杆的细线，clip 在杆里 */
  c.save();
  c.globalAlpha = 0.16;
  c.strokeStyle = '#5e3a14';
  c.lineCap = 'butt';
  for(const o of [-0.30, -0.12, 0.06, 0.26]){
    const a = at(0.09), b = at(0.53);
    c.lineWidth = 0.0016;
    c.beginPath();
    c.moveTo(a.x + px*a.w*o, a.z + pz*a.w*o);
    c.lineTo(b.x + px*b.w*o, b.z + pz*b.w*o);
    c.stroke();
  }
  c.restore();
  c.restore();   // 结束 clip

  /* ⑤ 皮头那一点点：压暗 + 一点抛光，让它像真的抵在球上 */
  c.save();
  const tp = at(0), tp2 = at(0.026);
  c.globalAlpha = 0.30;
  c.strokeStyle = '#000';
  c.lineWidth = tp.w;
  c.lineCap = 'butt';
  c.beginPath(); c.moveTo(tp.x, tp.z); c.lineTo(tp2.x, tp2.z); c.stroke();
  c.globalAlpha = 0.55;
  c.strokeStyle = '#fff';
  c.lineWidth = Math.max(0.0012, tp.w*0.20);
  c.beginPath();
  c.moveTo(tp.x + px*tp.w*0.22, tp.z + pz*tp.w*0.22);
  c.lineTo(tp2.x + px*tp2.w*0.22, tp2.z + pz*tp2.w*0.22);
  c.stroke();
  c.restore();

  c.restore();
}

function mix(a, b, t){
  const pa = [parseInt(a.slice(1,3),16), parseInt(a.slice(3,5),16), parseInt(a.slice(5,7),16)];
  const pb = [parseInt(b.slice(1,3),16), parseInt(b.slice(3,5),16), parseInt(b.slice(5,7),16)];
  const r = pa.map((v,i)=> Math.round(v + (pb[i]-v)*t));
  return 'rgb(' + r.join(',') + ')';
}

/* ══════════════════════════════════════════════════════════
   力度尺（竖向银灰标尺 + 黄色三角指针）
   ══════════════════════════════════════════════════════════ */
function drawPowerBar(){
  const W = pw.width / DPR, H = pw.height / DPR;
  pwx.setTransform(DPR, 0, 0, DPR, 0, 0);
  pwx.clearRect(0, 0, W, H);

  const bx = 5, bw = W - 10, top = 4, bh = H - 8;

  // 尺身
  const gg = pwx.createLinearGradient(bx, 0, bx + bw, 0);
  gg.addColorStop(0,   '#9aa4b0');
  gg.addColorStop(0.35,'#e6ebf0');
  gg.addColorStop(0.55,'#c9d2db');
  gg.addColorStop(1,   '#7e8894');
  pwx.fillStyle = gg;
  roundRectPath(pwx, bx, top, bw, bh, bw/2);
  pwx.fill();
  pwx.strokeStyle = 'rgba(20,25,40,.55)';
  pwx.lineWidth = 1.5;
  pwx.stroke();

  // 内凹阴影
  pwx.save();
  roundRectPath(pwx, bx, top, bw, bh, bw/2);
  pwx.clip();
  const sh = pwx.createLinearGradient(bx, 0, bx + bw, 0);
  sh.addColorStop(0, 'rgba(0,0,0,.20)');
  sh.addColorStop(0.3, 'rgba(0,0,0,0)');
  sh.addColorStop(0.7, 'rgba(255,255,255,.25)');
  sh.addColorStop(1, 'rgba(0,0,0,.22)');
  pwx.fillStyle = sh;
  pwx.fillRect(bx, top, bw, bh);
  pwx.restore();

  // 蓄力填充：从顶部往指针位置涨下来，一眼看出拉了多少杆
  const pp = Math.max(0, Math.min(1, power));
  const py = top + 8 + (bh - 16) * pp;      // 往下拉 → 指针往下
  if(pp > 0.004){
    pwx.save();
    roundRectPath(pwx, bx, top, bw, bh, bw/2);
    pwx.clip();
    const fg = pwx.createLinearGradient(0, top, 0, top + bh);
    fg.addColorStop(0,    'rgba(126,232,162,.95)');
    fg.addColorStop(0.5,  'rgba(255,214,107,.95)');
    fg.addColorStop(1,    'rgba(255,96,96,.97)');
    pwx.fillStyle = fg;
    pwx.fillRect(bx, top, bw, py - top);
    pwx.restore();
  }

  // 杆身：杆头停在指针上，拉得越下杆伸得越长（下拉拉杆）
  pwx.save();
  roundRectPath(pwx, bx, top, bw, bh, bw/2);
  pwx.clip();
  const cw = Math.max(3, bw*0.22);
  const cxx = bx + bw/2 - cw/2;
  const wd = pwx.createLinearGradient(cxx, 0, cxx + cw, 0);
  wd.addColorStop(0,   'rgba(120,78,42,.55)');
  wd.addColorStop(0.4, 'rgba(214,170,120,.55)');
  wd.addColorStop(1,   'rgba(96,60,32,.55)');
  pwx.fillStyle = wd;
  pwx.fillRect(cxx, top - 2, cw, Math.max(0, py - top + 2));
  // 杆头
  pwx.fillStyle = 'rgba(240,244,250,.85)';
  pwx.fillRect(cxx, py - 3, cw, 3);
  pwx.restore();

  // 刻度（左右交错）
  const N = 20;
  pwx.strokeStyle = 'rgba(24,30,46,.78)';
  for(let i = 0; i <= N; i++){
    const y = top + 8 + (bh - 16) * (1 - i/N);
    const major = (i % 5 === 0);
    const len = major ? bw*0.55 : bw*0.30;
    pwx.lineWidth = major ? 1.6 : 1;
    // 左
    pwx.beginPath(); pwx.moveTo(bx + 3, y); pwx.lineTo(bx + 3 + len, y); pwx.stroke();
    // 右
    pwx.beginPath(); pwx.moveTo(bx + bw - 3, y); pwx.lineTo(bx + bw - 3 - len, y); pwx.stroke();
  }

  // 黄色三角指针（在左侧，尖端朝右）
  pwx.save();
  const pg = pwx.createLinearGradient(0, py - 7, 0, py + 7);
  pg.addColorStop(0, '#ffe680');
  pg.addColorStop(1, '#e0a800');
  pwx.fillStyle = pg;
  pwx.beginPath();
  pwx.moveTo(0, py);
  pwx.lineTo(9, py - 6.5);
  pwx.lineTo(9, py + 6.5);
  pwx.closePath();
  pwx.fill();
  pwx.strokeStyle = 'rgba(90,60,0,.85)';
  pwx.lineWidth = 1;
  pwx.stroke();

  // 指针横贯线
  pwx.strokeStyle = 'rgba(255,215,80,.95)';
  pwx.lineWidth = 2;
  pwx.beginPath();
  pwx.moveTo(9, py); pwx.lineTo(bx + bw, py);
  pwx.stroke();
  pwx.restore();
}

/* ══════════════════════════════════════════════════════════
   右侧加塞球：白球 + 可拖的红点准心
   ══════════════════════════════════════════════════════════ */
function drawSpinBall(){
  const W = sb.width / DPR, H = sb.height / DPR;
  sbx.setTransform(DPR, 0, 0, DPR, 0, 0);
  sbx.clearRect(0, 0, W, H);

  const cx = W/2, cy = H/2, R = Math.min(W, H)/2 - 1;

  // 球体
  const g = sbx.createRadialGradient(cx - R*0.34, cy - R*0.38, R*0.06, cx, cy, R*1.06);
  g.addColorStop(0,    '#ffffff');
  g.addColorStop(0.42, '#f4f2ea');
  g.addColorStop(0.78, '#dcd8cc');
  g.addColorStop(1,    '#a9a497');
  sbx.fillStyle = g;
  sbx.beginPath(); sbx.arc(cx, cy, R, 0, Math.PI*2); sbx.fill();
  sbx.strokeStyle = 'rgba(28,28,38,.6)';
  sbx.lineWidth = 1.4;
  sbx.stroke();

  // 同心圈 + 十字线
  sbx.strokeStyle = 'rgba(120,122,138,.26)';
  sbx.lineWidth = 1;
  for(const k of [0.45, 0.75]){
    sbx.beginPath(); sbx.arc(cx, cy, R*k, 0, Math.PI*2); sbx.stroke();
  }
  sbx.strokeStyle = 'rgba(120,122,138,.40)';
  sbx.beginPath(); sbx.moveTo(cx - R*0.82, cy); sbx.lineTo(cx + R*0.82, cy); sbx.stroke();
  sbx.beginPath(); sbx.moveTo(cx, cy - R*0.82); sbx.lineTo(cx, cy + R*0.82); sbx.stroke();

  // 红色准心（高杆在上、低杆在下、左右塞在两侧）
  const px2 = cx + spinX * R * 0.72;
  const py2 = cy - spinY * R * 0.72;
  const rg = sbx.createRadialGradient(px2 - R*0.08, py2 - R*0.08, R*0.02, px2, py2, R*0.30);
  rg.addColorStop(0, '#ff7b7b');
  rg.addColorStop(0.6, '#e02a2a');
  rg.addColorStop(1, '#a01414');
  sbx.fillStyle = rg;
  sbx.beginPath(); sbx.arc(px2, py2, R*0.26, 0, Math.PI*2); sbx.fill();
  sbx.strokeStyle = 'rgba(80,0,0,.85)';
  sbx.lineWidth = 1.2;
  sbx.stroke();
}

/* ══════════════════════════════════════════════════════════
   右侧角度微调刻度：增量式，拖多少转多少，能一直转到 360°
   ══════════════════════════════════════════════════════════ */
function drawFineBar(){
  const W = fb.width / DPR, H = fb.height / DPR;
  fbx.setTransform(DPR, 0, 0, DPR, 0, 0);
  fbx.clearRect(0, 0, W, H);

  const bx = 5, bw = W - 10, top = 6, bh = H - 12;
  const cy = top + bh/2;

  // 尺身
  const gg = fbx.createLinearGradient(bx, 0, bx + bw, 0);
  gg.addColorStop(0,   '#9aa4b0');
  gg.addColorStop(0.35,'#e6ebf0');
  gg.addColorStop(0.55,'#c9d2db');
  gg.addColorStop(1,   '#7e8894');
  fbx.fillStyle = gg;
  roundRectPath(fbx, bx, top, bw, bh, bw/2);
  fbx.fill();
  fbx.strokeStyle = 'rgba(20,25,40,.55)';
  fbx.lineWidth = 1.4;
  fbx.stroke();

  // 中位凹槽（0° 的位置）
  fbx.save();
  roundRectPath(fbx, bx, top, bw, bh, bw/2);
  fbx.clip();
  fbx.fillStyle = 'rgba(70,90,120,.16)';
  fbx.fillRect(bx, cy - bh*0.055, bw, bh*0.11);
  fbx.restore();

  // 刻度：13 条刻度线只是视觉标尺，实际角度无上限
  const steps = 6;
  for(let i = -steps; i <= steps; i++){
    const y = cy + (bh/2 - 8) * (i / steps);
    const major = (i === 0 || Math.abs(i) === steps);
    const half  = (i % 2 === 0);
    const len   = major ? bw*0.74 : (half ? bw*0.46 : bw*0.26);
    fbx.strokeStyle = (i === 0) ? 'rgba(200,40,40,.9)' : 'rgba(24,30,46,.62)';
    fbx.lineWidth = major ? 1.7 : 1;
    fbx.beginPath();
    fbx.moveTo(bx + bw/2 - len/2, y);
    fbx.lineTo(bx + bw/2 + len/2, y);
    fbx.stroke();
  }

  // 指针：位置只映射到 ±15° 的显示范围，超出就贴边（角度本身还在变）
  const raw = aimOffset / FINE_SHOW;
  const t  = Math.max(-1, Math.min(1, raw));
  const over = Math.abs(raw) > 1;
  const py = cy + (bh/2 - 8) * t;
  const deg = Math.round(aimOffset * 180 / Math.PI);
  if(fineValEl) fineValEl.textContent = (deg > 0 ? '+' : '') + deg + '°';
  const hot  = over ? '#ff7a5a' : (Math.abs(t) < 0.02 ? '#8ef0b0' : '#ffd750');
  fbx.fillStyle = hot;
  fbx.beginPath();
  fbx.moveTo(bx + bw + 3.5, py);
  fbx.lineTo(bx + bw - 2.5, py - 6.5);
  fbx.lineTo(bx + bw - 2.5, py + 6.5);
  fbx.closePath();
  fbx.fill();
  fbx.strokeStyle = 'rgba(90,60,0,.85)';
  fbx.lineWidth = 1;
  fbx.stroke();
  fbx.strokeStyle = hot;
  fbx.globalAlpha = 0.95;
  fbx.lineWidth = 1.8;
  fbx.beginPath(); fbx.moveTo(bx, py); fbx.lineTo(bx + bw, py); fbx.stroke();
  fbx.globalAlpha = 1;
}

/* ══════════════════════════════════════════════════════════
   主绘制
   ══════════════════════════════════════════════════════════ */
/* 中央水印：画在屏幕坐标系里，竖屏旋转后字也是正的 */
function drawWatermark(c){
  const p = worldToScreen(0, 0);
  const R = 0.165 * SCALE;
  setScreenTransform();
  c.save();
  c.textAlign = 'center';
  c.textBaseline = 'middle';

  c.globalAlpha = 0.042;
  c.strokeStyle = '#03130a';
  c.lineWidth = Math.max(1.3, 0.010 * SCALE);
  c.beginPath(); c.arc(p.x, p.y, R, 0, Math.PI*2); c.stroke();
  c.beginPath(); c.arc(p.x, p.y, R*0.86, 0, Math.PI*2); c.stroke();

  c.fillStyle = '#03130a';
  c.font = `900 ${R*1.34}px -apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif`;
  c.fillText('中 八', p.x, p.y - R*0.06);

  c.font = `700 ${Math.max(6, R*0.24)}px -apple-system,Arial,sans-serif`;
  c.fillText('E I G H T   B A L L', p.x, p.y + R*0.92);
  c.restore();
}

function draw(){
  setScreenTransform();
  ctx.clearRect(0, 0, LW, LH);

  // 背景（深紫，参考图那种）
  const bg = ctx.createRadialGradient(LW*0.5, LH*0.35, 20, LW*0.5, LH*0.5, Math.max(LW,LH)*0.85);
  bg.addColorStop(0, '#2a2050');
  bg.addColorStop(0.55, '#1c1638');
  bg.addColorStop(1, '#100c22');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, LW, LH);

  setWorldTransform();
  drawTable(ctx);
  drawWatermark(ctx);

  // 球（按 z 排序，让后画的有正确叠压感）
  const sorted = balls.filter(b => b.alive).slice()
    .sort((a, b) => (a.z - b.z) || (a.x - b.x));
  for(const b of sorted) drawBall(ctx, b);

  // 特效画在球上面（火花/冲击波/落袋缩球）
  setWorldTransform();
  drawFx(ctx);

  drawAim(ctx);
  drawCue(ctx);

  drawBallNumbers(ctx);
  drawPraise(ctx);
}

/* ══════════════════════════════════════════════════════════
   练习模式规则：没有对手、不分组、不换边 —— 把 8 颗球全打进去就算完
   ══════════════════════════════════════════════════════════ */
function remainingOf(g){
  if(!g) return 0;
  return balls.filter(b => b.alive && groupOf(b.n) === g).length;
}

function resolveShot(s){
  if(gameOver) return;

  const potted = s.potted || [];
  const objPotted = potted.filter(n => n !== 0);

  /* 白球落袋：不算罚，直接让你重摆 */
  const cb = cueBall();
  if(cb && !cb.alive){
    cb.alive = true;
    cb.x = -HW*0.62; cb.z = 0; cb.vx = 0; cb.vz = 0;
    ballInHand = true;
  } else if(s.cuePotted && cb){
    // 极少数情况下 cuePotted 但 alive 已恢复，兜底
    ballInHand = true;
  }

  const left = remainingBalls();

  updateHUD();

  if(!left.length){ winGame(); return; }

  if(ballInHand){
    toast('白球落袋 · 拖到想放的位置');
  } else if(objPotted.length){
    toast(`进 ${objPotted.length} 颗 · 还剩 ${left.length} 颗`);
  }
}

function winGame(){
  gameOver = true;
  shooting = false;
  ballInHand = false;
  const t = fmtTime(elapsed);
  showModal(
    '🏆',
    '全 部 打 完',
    `8 颗球清台完成<br><br>用时 <b>${t}</b> · 共 <b>${shots}</b> 杆` +
    `<br><span style="color:#7f8ab0">平均 ${(shots/15).toFixed(1)} 杆一颗</span>`,
    '',
    [{ t:'再来一局', fn: newGame }]
  );
  updateHUD();
}

function fmtTime(sec){
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return m + ':' + (s < 10 ? '0' : '') + s;
}

/* ══════════════════════════════════════════════════════════
   调试用：ghost ball 求解（不参与对局，只给自动测试/以后加 AI 用）
   ══════════════════════════════════════════════════════════ */
function distPointSeg(px, pz, x1, z1, x2, z2){
  const dx = x2-x1, dz = z2-z1;
  const L2 = dx*dx + dz*dz;
  if(L2 < 1e-12) return Math.hypot(px-x1, pz-z1);
  let t = ((px-x1)*dx + (pz-z1)*dz)/L2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px-(x1+t*dx), pz-(z1+t*dz));
}
function segBlocked(x1, z1, x2, z2, ignore){
  for(const b of balls){
    if(!b.alive) continue;
    if(ignore.indexOf(b) >= 0) continue;
    if(distPointSeg(b.x, b.z, x1, z1, x2, z2) < BALL_R*2*0.94) return true;
  }
  return false;
}
/** 找一个能进的线路（自动测试用；练习模式里没有任何地方自动出杆） */
function pickShot(){
  const cb = cueBall();
  if(!cb || !cb.alive) return null;
  const targets = remainingBalls();
  if(!targets.length) return null;

  let best = null;
  for(const t of targets){
    for(const [px, pz] of POCKETS){
      let dx = px - t.x, dz = pz - t.z;
      const dTP = Math.hypot(dx, dz);
      if(dTP < 0.02) continue;
      const ux = dx/dTP, uz = dz/dTP;

      const gx = t.x - ux*BALL_R*2;
      const gz = t.z - uz*BALL_R*2;

      const cx = gx - cb.x, cz = gz - cb.z;
      const dCG = Math.hypot(cx, cz);
      if(dCG < 1e-3) continue;
      const wx = cx/dCG, wz = cz/dCG;

      const cosCut = wx*ux + wz*uz;
      if(cosCut < 0.25) continue;

      if(segBlocked(cb.x, cb.z, gx, gz, [cb, t])) continue;
      if(segBlocked(t.x, t.z, px, pz, [cb, t])) continue;

      const score = Math.pow(cosCut, 2.4) * 1.9 / (1 + dCG*0.5 + dTP*0.9);
      if(!best || score > best.score) best = { score, t, dCG, dTP, cosCut, wx, wz };
    }
  }
  return best;
}

/* ══════════════════════════════════════════════════════════
   自由球摆放
   ══════════════════════════════════════════════════════════ */
function tryPlaceCue(w){
  const cb = cueBall();
  if(!cb || !cb.alive || !w) return;
  const lx = HW - BALL_R, lz = HH - BALL_R;
  let x = Math.max(-lx, Math.min(lx, w.x));
  let z = Math.max(-lz, Math.min(lz, w.z));

  for(const b of balls){
    if(b === cb || !b.alive) continue;
    const d = Math.hypot(x - b.x, z - b.z);
    if(d < BALL_R*2.12){
      const nx = d > 1e-5 ? (x-b.x)/d : 1;
      const nz = d > 1e-5 ? (z-b.z)/d : 0;
      x = b.x + nx*BALL_R*2.12;
      z = b.z + nz*BALL_R*2.12;
    }
  }
  x = Math.max(-lx, Math.min(lx, x));
  z = Math.max(-lz, Math.min(lz, z));
  cb.x = x; cb.z = z; cb.vx = 0; cb.vz = 0;
}

let lastShownSec = -1;
function tickClock(){
  const sec = Math.floor(elapsed);
  if(sec === lastShownSec) return;      // 只在秒数变化时才碰 DOM
  lastShownSec = sec;
  const t = document.getElementById('timer');
  if(t) t.textContent = fmtTime(elapsed);
}

function clockStep(dt){
  if(gameOver) return;
  elapsed += dt;                        // 球在动的时候也要走表
  tickClock();
}

/* ══════════════════════════════════════════════════════════
   输入
   ══════════════════════════════════════════════════════════ */
let dragStart = null;
const TAP_SLOP = 7;        // 屏幕像素：手指移动超过这个才算「滑动」，否则算「点一下」

function evPos(e){
  const t = e.touches ? e.touches[0] : e;
  // 竖屏时 stage 被转了 90°，getBoundingClientRect 给的是旋转后的包围盒，不能用
  return toStage(t.clientX, t.clientY);
}

function onDown(e){
  if(shooting || gameOver || document.getElementById('modal').classList.contains('show')) return;
  if(e.cancelable) e.preventDefault();
  const p = evPos(e);
  const w = screenToWorld(p.x, p.y);

  const cb = cueBall();
  if(!cb || !cb.alive) return;

  if(ballInHand){
    placing = true;
    dragStart = w;
    tryPlaceCue(w);
    return;
  }

  /* 按下时【绝对不动方向】。
     以前一按下就把杆指向手指所在点 —— 可是手指本来就压在杆上（白球后方），
     于是杆瞬间翻到对面。这是最反直觉的地方。 */
  const ang = aimAngleTo(w);
  dragStart = {
    sx: p.x, sy: p.y,
    ang: ang,
    baseAng: Math.atan2(aimBase.z, aimBase.x),
    moved: false
  };
  aiming = true;
}

function onMove(e){
  if(!aiming && !placing) return;
  if(e.cancelable) e.preventDefault();
  const p = evPos(e);
  const w = screenToWorld(p.x, p.y);

  if(placing){ tryPlaceCue(w); return; }
  if(!dragStart) return;

  const dpx = Math.hypot(p.x - dragStart.sx, p.y - dragStart.sy);
  if(!dragStart.moved){
    if(dpx < TAP_SLOP) return;          // 还在「点击」容差内，杆不动
    dragStart.moved = true;             // 越过容差：判定为滑动，但基准仍用按下那一刻
  }

  const ang = aimAngleTo(w);
  if(ang === null || dragStart.ang === null) return;
  // 手指绕白球转了多少度，杆就跟着转多少度（微调偏移保留）
  const delta = normAngle(ang - dragStart.ang);
  aimBase = {
    x: Math.cos(dragStart.baseAng + delta),
    z: Math.sin(dragStart.baseAng + delta)
  };
  applyAim();
}

/* 大方向 + 微调偏移 = 最终杆向（偏移无上限，可以转满一圈） */
function applyAim(){
  const a = Math.atan2(aimBase.z, aimBase.x) + aimOffset;
  aimDir = { x: Math.cos(a), z: Math.sin(a) };
  drawFineBar();
}

/* 从白球指向某个世界点的角度；太近就返回 null */
function aimAngleTo(w){
  const cb = cueBall();
  if(!cb) return null;
  const dx = w.x - cb.x, dz = w.z - cb.z;
  if(Math.hypot(dx, dz) < 0.012) return null;
  return Math.atan2(dz, dx);
}

function onUp(e){
  if(placing){
    placing = false;
    ballInHand = false;
    dragStart = null;
    updateHUD();
    toast('白球摆好了 · 拖左边力度杆击球');
    return;
  }
  if(!aiming) return;
  /* 没滑动就松手 = 点了一下 → 直接把杆指到那个点（快速指定位置），微调归零 */
  if(dragStart && !dragStart.moved && e){
    const p = evPos(e);
    const w = screenToWorld(p.x, p.y);
    const a = aimAngleTo(w);
    if(a !== null){
      aimBase = { x: Math.cos(a), z: Math.sin(a) };
      aimOffset = 0;
      applyAim();
    }
  }
  aiming = false;
  dragStart = null;
  // 松手不出杆 —— 力度和出手都由左边的力度杆负责
}

function doShoot(){
  const cb = cueBall();
  if(!cb || !cb.alive) { power = 0; drawPowerBar(); return; }
  const v = MAX_SPEED * Math.pow(power, 0.85);
  cb.vx = aimDir.x * v;
  cb.vz = aimDir.z * v;
  applyCueSpin(cb, v);
  shots++;
  shooting = true;
  shotLog = { firstHit:null, potted:[], cuePotted:false, spinY: spinY, sideX: spinX };
  shotStartT = performance.now();
  power = 0;
  drawPowerBar();
  updateHUD();
}

/* 击球点 → 初始角速度。这是高低杆唯一的来源：
   中杆 ω=0（球先纯滑动，很快被摩擦带成滚动）；
   高杆 ω 前旋过剩 → 接触点朝后打滑 → 摩擦推着球继续加速跑更远；
   低杆 ω 反向 → 摩擦把球往后拽 → 缩杆。
   撞到目标球后白球速度骤减但 ω 还在，于是自动产生跟杆/缩杆，
   不再需要在碰撞里「补一脚」。 */
function applyCueSpin(cb, v){
  const rollOmega = v / BALL_R;                 // 纯滚对应的角速度
  const k = (spinY || 0) * 1.75;                // 真实上限约 ±1.75 倍
  cb.wx =  aimDir.z * rollOmega * k;
  cb.wz = -aimDir.x * rollOmega * k;
  cb.wy =  (spinX || 0) * rollOmega * 0.55;     // 左右塞 → 绕垂直轴自转
}

/* ══════════════════════════════════════════════════════════
   主循环
   ══════════════════════════════════════════════════════════ */
let lastT = 0;
function loop(t){
  requestAnimationFrame(loop);
  const now = t || performance.now();
  let dt = (now - lastT) / 1000;
  lastT = now;
  if(!isFinite(dt) || dt <= 0) dt = 1/60;
  dt = Math.min(dt, 1/30);

  clockStep(dt);       // 计时和击球状态无关，一直走

  if(shooting){
    if(now - shotStartT > SHOT_TIMEOUT){
      for(const b of balls){ b.vx = 0; b.vz = 0; }
    }
    const sub = 8, h = dt/sub;
    let moving = false;
    for(let i = 0; i < sub; i++){ if(stepPhysics(h)) moving = true; }
    if(!moving){
      shooting = false;
      const s = shotLog; shotLog = null;
      if(s) resolveShot(s);
      updateHUD();
    }
  }

  stepFx(dt);          // 特效自己走，球停了也要把火花/落袋动画播完
  stepPraise(dt);
  draw();
}

/* ══════════════════════════════════════════════════════════
   开局
   ══════════════════════════════════════════════════════════ */
function newGame(){
  shots = 0;
  ballInHand = false;
  gameOver = false;
  shooting = false;
  shotLog = null;
  aiming = false;
  placing = false;
  power = 0;
  spinX = 0; spinY = 0;
  aimBase = { x: 1, z: 0 };
  aimOffset = 0;
  applyAim();
  document.getElementById('modal').classList.remove('show');
  newRack();
  elapsed = 0;
  lastShownSec = -1;
  updateHUD();
  drawPowerBar();
  drawSpinBall();
  drawFineBar();
  toast('绕白球滑动转杆 · 点一下直接指过去 · 下拉左边力度杆出杆');
}
